[workspace]
resolver = "2"
members = [
    "crates/aer-domain",
    "crates/aer-contracts",
    "tools/aer-doc-check",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"
