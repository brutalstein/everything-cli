[workspace]
resolver = "2"
members = [
    "crates/aer-domain",
    "crates/aer-contracts",
    "crates/aer-storage",
    "crates/aer-exec",
    "crates/aer-environment",
    "crates/aer-workspace",
    "crates/aer-provider",
    "crates/aer-research",
    "crates/aer-core",
    "crates/aer-repo",
    "crates/aer-cli",
    "tools/aer-doc-check",
    "tools/aer-phase0-check",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
jsonschema = { version = "=0.49.2", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
tree-sitter = "=0.26.11"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
ulid = "=3.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
