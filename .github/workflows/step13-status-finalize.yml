name: step13-status-finalize

on:
  push:
    branches: [agent/step-13-bounded-parallel-execution]
    paths: ['scripts/step13_status_finalize.py']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-13-bounded-parallel-execution
          fetch-depth: 0
      - run: python scripts/step13_status_finalize.py
      - name: Commit status ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Record Step 13 repository verification [skip ci]"
          git push origin HEAD:agent/step-13-bounded-parallel-execution
