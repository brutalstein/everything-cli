name: Step 12 Tier 2 provenance

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-tier2-provenance.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Bind Cargo project view to environment fingerprint and real local dependency topology
        shell: python
        run: |
          from pathlib import Path

          cargo = Path('crates/aer-repo/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          if 'aer-environment = { path = "../aer-environment" }' not in text:
              text = text.replace(
                  '[dependencies]\n',
                  '[dependencies]\naer-environment = { path = "../aer-environment" }\n',
                  1,
              )
          cargo.write_text(text, encoding='utf-8')

          schema = Path('crates/aer-repo/src/ri2/schema.rs')
          text = schema.read_text(encoding='utf-8')
          old = '''           producer_version TEXT NOT NULL,
                     freshness TEXT NOT NULL,
                     capability_tier INTEGER NOT NULL,
          '''
          new = '''           producer_version TEXT NOT NULL,
                     environment_fingerprint TEXT,
                     freshness TEXT NOT NULL,
                     capability_tier INTEGER NOT NULL,
          '''
          if old not in text:
              raise SystemExit('ri2_view_state schema target not found')
          schema.write_text(text.replace(old, new, 1), encoding='utf-8')

          model = Path('crates/aer-repo/src/ri2/model.rs')
          text = model.read_text(encoding='utf-8')
          old = '''    pub producer_version: String,
              pub freshness: FreshnessState,
          '''
          new = '''    pub producer_version: String,
              pub environment_fingerprint: Option<String>,
              pub freshness: FreshnessState,
          '''
          if old not in text:
              raise SystemExit('ViewState model target not found')
          model.write_text(text.replace(old, new, 1), encoding='utf-8')

          build = Path('crates/aer-repo/src/ri2/build.rs')
          text = build.read_text(encoding='utf-8')
          text = text.replace(
              'use aer_exec::{CommandSpec, ExecutionPolicy, LocalProcessExecutor, SideEffectClass};',
              'use aer_environment::EnvironmentFingerprint;\nuse aer_exec::{CommandSpec, ExecutionPolicy, LocalProcessExecutor, SideEffectClass};',
              1,
          )
          old_struct = '''pub(crate) struct BuildTopology {
              pub state: FreshnessState,
              pub packages: Vec<BuildPackage>,
              pub targets: Vec<BuildTarget>,
              pub dependencies: Vec<ProjectDependency>,
          }
          '''
          new_struct = '''pub(crate) struct BuildTopology {
              pub state: FreshnessState,
              pub environment_fingerprint: Option<String>,
              pub packages: Vec<BuildPackage>,
              pub targets: Vec<BuildTarget>,
              pub dependencies: Vec<ProjectDependency>,
          }
          '''
          if old_struct not in text:
              raise SystemExit('BuildTopology struct target not found')
          text = text.replace(old_struct, new_struct, 1)
          text = text.replace(
              '''        Self {
                          state: FreshnessState::Unavailable,
                          packages: Vec::new(),
          ''',
              '''        Self {
                          state: FreshnessState::Unavailable,
                          environment_fingerprint: None,
                          packages: Vec::new(),
          ''',
              1,
          )
          old_collect = '''pub(crate) fn collect_project_topology(repo: &Path, policy: &IndexPolicy) -> BuildTopology {
              if !repo.join("Cargo.toml").is_file() {
                  return BuildTopology::unavailable();
              }
          '''
          new_collect = '''pub(crate) fn collect_project_topology(repo: &Path, policy: &IndexPolicy) -> BuildTopology {
              if !repo.join("Cargo.toml").is_file() {
                  return BuildTopology::unavailable();
              }
              let environment_fingerprint = match EnvironmentFingerprint::discover(repo) {
                  Ok(fingerprint) => Some(fingerprint.digest_hex()),
                  Err(_) => return BuildTopology::unavailable(),
              };
          '''
          if old_collect not in text:
              raise SystemExit('collect_project_topology target not found')
          text = text.replace(old_collect, new_collect, 1)
          text = text.replace(
              'return BuildTopology::unavailable();\n    };\n    let Ok(result)',
              'return BuildTopology { environment_fingerprint, ..BuildTopology::unavailable() };\n    };\n    let Ok(result)',
              1,
          )
          text = text.replace(
              'return BuildTopology::unavailable();\n    };\n    if !result.success',
              'return BuildTopology { environment_fingerprint, ..BuildTopology::unavailable() };\n    };\n    if !result.success',
              1,
          )
          text = text.replace(
              'return BuildTopology::unavailable();\n    }\n    let Ok(root)',
              'return BuildTopology { environment_fingerprint, ..BuildTopology::unavailable() };\n    }\n    let Ok(root)',
              1,
          )
          text = text.replace(
              'return BuildTopology::unavailable();\n    };\n    parse_cargo_metadata(repo, &root).unwrap_or_else(|_| BuildTopology::unavailable())',
              'return BuildTopology { environment_fingerprint, ..BuildTopology::unavailable() };\n    };\n    parse_cargo_metadata(repo, &root, environment_fingerprint.clone())\n        .unwrap_or_else(|_| BuildTopology { environment_fingerprint, ..BuildTopology::unavailable() })',
              1,
          )
          text = text.replace(
              'fn parse_cargo_metadata(repo: &Path, root: &Value) -> Result<BuildTopology, RepoError> {',
              'fn parse_cargo_metadata(\n    repo: &Path,\n    root: &Value,\n    environment_fingerprint: Option<String>,\n) -> Result<BuildTopology, RepoError> {',
              1,
          )
          text = text.replace(
              '''    Ok(BuildTopology {
                      state: FreshnessState::Current,
                      packages,
          ''',
              '''    Ok(BuildTopology {
                      state: FreshnessState::Current,
                      environment_fingerprint,
                      packages,
          ''',
              1,
          )
          build.write_text(text, encoding='utf-8')

          graph = Path('crates/aer-repo/src/ri2/graph_write.rs')
          text = graph.read_text(encoding='utf-8')
          text = text.replace(
              '''        topology.state,
                      CapabilityTier::Tier2Project,
                  )?;
          ''',
              '''        topology.state,
                      CapabilityTier::Tier2Project,
                      topology.environment_fingerprint.as_deref(),
                  )?;
          ''',
              1,
          )
          # Add None to every remaining insert_view_state call that still has the old final tier argument.
          for tier in ['Tier0Text', 'Tier1Syntax', 'Tier3PreciseSemantic', 'Tier4DynamicEvidence']:
              text = text.replace(
                  f'        CapabilityTier::{tier},\n    )?;',
                  f'        CapabilityTier::{tier},\n        None,\n    )?;',
              )
          old_sig = '''    freshness: FreshnessState,
              tier: CapabilityTier,
          ) -> Result<(), RepoError> {
              tx.execute(
                  "INSERT INTO ri2_view_state(snapshot_id,view_name,producer_id,producer_version,freshness,capability_tier) VALUES(?,?,?,?,?,?)",
                  params![
                      snapshot_id,
                      view_name,
                      producer_id,
                      producer_version,
                      freshness.as_str(),
                      i64::from(tier.as_u8())
                  ],
              )?;
          '''
          new_sig = '''    freshness: FreshnessState,
              tier: CapabilityTier,
              environment_fingerprint: Option<&str>,
          ) -> Result<(), RepoError> {
              tx.execute(
                  "INSERT INTO ri2_view_state(snapshot_id,view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier) VALUES(?,?,?,?,?,?,?)",
                  params![
                      snapshot_id,
                      view_name,
                      producer_id,
                      producer_version,
                      environment_fingerprint,
                      freshness.as_str(),
                      i64::from(tier.as_u8())
                  ],
              )?;
          '''
          if old_sig not in text:
              raise SystemExit('insert_view_state signature target not found')
          graph.write_text(text.replace(old_sig, new_sig, 1), encoding='utf-8')

          query = Path('crates/aer-repo/src/ri2/graph_query.rs')
          text = query.read_text(encoding='utf-8')
          text = text.replace(
              '"SELECT view_name,producer_id,producer_version,freshness,capability_tier FROM ri2_view_state WHERE snapshot_id=? ORDER BY view_name",',
              '"SELECT view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier FROM ri2_view_state WHERE snapshot_id=? ORDER BY view_name",',
              1,
          )
          old_tuple = '''                row.get::<_, String>(2)?,
                          row.get::<_, String>(3)?,
                          row.get::<_, i64>(4)?,
          '''
          new_tuple = '''                row.get::<_, String>(2)?,
                          row.get::<_, Option<String>>(3)?,
                          row.get::<_, String>(4)?,
                          row.get::<_, i64>(5)?,
          '''
          if old_tuple not in text:
              raise SystemExit('view-state row tuple target not found')
          text = text.replace(old_tuple, new_tuple, 1)
          text = text.replace(
              'let (view_name, producer_id, producer_version, freshness, tier) = row?;',
              'let (view_name, producer_id, producer_version, environment_fingerprint, freshness, tier) = row?;',
              1,
          )
          text = text.replace(
              '''                producer_version,
                          freshness: FreshnessState::parse(&freshness)?,
          ''',
              '''                producer_version,
                          environment_fingerprint,
                          freshness: FreshnessState::parse(&freshness)?,
          ''',
              1,
          )
          query.write_text(text, encoding='utf-8')

          freshness = Path('crates/aer-repo/src/ri2/freshness.rs')
          text = freshness.read_text(encoding='utf-8')
          text = text.replace(
              'use rusqlite::OptionalExtension;',
              'use aer_environment::EnvironmentFingerprint;\nuse rusqlite::OptionalExtension;',
              1,
          )
          old_project = '''        let project_producer = self
                  .connection
                  .query_row(
                      "SELECT producer_id,producer_version FROM ri2_view_state WHERE snapshot_id=? AND view_name='project'",
                      [snapshot_id],
                      |row| Ok((row.get::<_, String>(0)?, row.get::<_, String>(1)?)),
                  )
                  .optional()?;
              if project_producer.as_ref().is_none_or(|(id, version)| {
                  id != CARGO_PRODUCER || version != CARGO_PRODUCER_VERSION
              }) {
                  return Ok(true);
              }
          '''
          new_project = '''        let project_producer = self
                  .connection
                  .query_row(
                      "SELECT producer_id,producer_version,environment_fingerprint FROM ri2_view_state WHERE snapshot_id=? AND view_name='project'",
                      [snapshot_id],
                      |row| {
                          Ok((
                              row.get::<_, String>(0)?,
                              row.get::<_, String>(1)?,
                              row.get::<_, Option<String>>(2)?,
                          ))
                      },
                  )
                  .optional()?;
              if project_producer.as_ref().is_none_or(|(id, version, _)| {
                  id != CARGO_PRODUCER || version != CARGO_PRODUCER_VERSION
              }) {
                  return Ok(true);
              }
              if let Some((_, _, Some(stored_environment))) = project_producer {
                  let repo_root: String = self.connection.query_row(
                      "SELECT repo_root FROM snapshots WHERE snapshot_id=?",
                      [snapshot_id],
                      |row| row.get(0),
                  )?;
                  let current_environment = EnvironmentFingerprint::discover(repo_root)?.digest_hex();
                  if current_environment != stored_environment {
                      return Ok(true);
                  }
              }
          '''
          if old_project not in text:
              raise SystemExit('project freshness target not found')
          freshness.write_text(text.replace(old_project, new_project, 1), encoding='utf-8')

          bench = Path('crates/aer-repo/tests/repo_intel_2_bench.rs')
          text = bench.read_text(encoding='utf-8')
          text = text.replace(
              'fs::create_dir_all(repo.join("web")).expect("web dir");',
              'fs::create_dir_all(repo.join("web")).expect("web dir");\n        fs::create_dir_all(repo.join("helper/src")).expect("helper src dir");',
              1,
          )
          text = text.replace(
              '"[package]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n",',
              '"[workspace]\\nmembers = [\\"helper\\"]\\nresolver = \\"3\\"\\n\\n[package]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n\\n[dependencies]\\nhelper = { path = \\"helper\\" }\\n",',
              1,
          )
          text = text.replace(
              '"# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\n",',
              '"# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \\"helper\\"\\nversion = \\"0.1.0\\"\\n\\n[[package]]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\ndependencies = [\\n \\"helper\\",\\n]\\n",',
              1,
          )
          helper_write = '''        fs::write(
              repo.join("helper/Cargo.toml"),
              "[package]\\nname = \\"helper\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n",
          )
          .expect("helper manifest");
          fs::write(
              repo.join("helper/src/lib.rs"),
              "pub fn helper_marker() -> bool { true }\\n",
          )
          .expect("helper source");
          '''
          anchor = '        fs::write(\n            repo.join("src/lib.rs"),'
          if anchor not in text:
              raise SystemExit('helper fixture insertion target not found')
          text = text.replace(anchor, helper_write + anchor, 1)
          text = text.replace('assert_eq!(packages.len(), 1);', 'assert_eq!(packages.len(), 2);', 1)
          text = text.replace(
              'assert_eq!(packages[0].name, "ri2-fixture");',
              'assert!(packages.iter().any(|package| package.name == "ri2-fixture"));\n    assert!(packages.iter().any(|package| package.name == "helper"));\n    let dependencies = index.project_dependencies(snapshot).expect("project dependencies");\n    assert!(dependencies.iter().any(|dependency| {\n        dependency.target_name == "helper" && dependency.target_package_id.is_some()\n    }));',
              1,
          )
          text = text.replace(
              'view.view_name == "project"\n                && view.freshness == FreshnessState::Current\n                && view.capability_tier == CapabilityTier::Tier2Project',
              'view.view_name == "project"\n                && view.freshness == FreshnessState::Current\n                && view.capability_tier == CapabilityTier::Tier2Project\n                && view.environment_fingerprint.is_some()',
              1,
          )
          # Freshness test also corrupts the Tier-2 environment provenance.
          target = '.expect("simulate graph producer drift");'
          addition = '''.expect("simulate graph producer drift");
              connection
                  .execute(
                      "UPDATE ri2_view_state SET environment_fingerprint='stale-env-v0' WHERE snapshot_id=? AND view_name='project'",
                      [&snapshot],
                  )
                  .expect("simulate project environment drift");'''
          if target not in text:
              raise SystemExit('freshness benchmark env target not found')
          text = text.replace(target, addition, 1)
          bench.write_text(text, encoding='utf-8')
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Refresh lock after existing workspace dependency edge
        run: cargo +1.97.1 check -p aer-repo
      - name: Frozen-lock lint
        run: cargo +1.97.1 clippy --locked -p aer-repo --all-targets -- -D warnings
      - name: RepoIntelBench
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench
      - name: Full aer-repo regression
        run: cargo +1.97.1 test --locked -p aer-repo --all-targets
      - name: Commit verified Tier-2 provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aer-repo
          git diff --cached --quiet && exit 0
          git commit -m "Bind RI2 project topology to environment provenance"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
