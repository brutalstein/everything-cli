name: Finalize Step 12 status ledger

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-status-finalize.yml'

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Patch status ledger
        run: python scripts/finalize_step12_status.py
      - name: Commit ledger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Record Step 12 repository verification [skip ci]"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
