name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Capture resolved Cargo lock
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-cargo-lock-bootstrap
          path: Cargo.lock
          retention-days: 1

      - name: Test
        run: cargo +1.97.1 test --workspace --all-targets

      - name: Documentation integrity
        run: cargo +1.97.1 run -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        run: cargo +1.97.1 run -p aer-phase0-check -- --check
