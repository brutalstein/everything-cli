name: foundation-ci

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Persist resolved Cargo lock
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Cargo.lock)" ]; then
            echo "Cargo.lock is already tracked and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Lock Phase 0 Rust dependencies [skip ci]"
          git push origin HEAD:main

      - name: Test
        run: cargo +1.97.1 test --workspace --all-targets

      - name: Documentation integrity
        run: cargo +1.97.1 run -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        run: cargo +1.97.1 run -p aer-phase0-check -- --check
