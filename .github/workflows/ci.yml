name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Repair SHA-256 encoding compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          exec_path = Path("crates/aer-exec/src/lib.rs")
          text = exec_path.read_text()
          old = '        sha256: format!("{:x}", hasher.finalize()),\n'
          if old not in text:
              raise SystemExit("expected aer-exec digest formatting pattern not found")
          text = text.replace(old, '        sha256: lowercase_hex(hasher.finalize().as_ref()),\n', 1)
          marker = 'fn join_capture(\n'
          helper = '''#[must_use]\npub fn lowercase_hex(bytes: &[u8]) -> String {\n    let mut output = String::with_capacity(bytes.len() * 2);\n    for byte in bytes {\n        use fmt::Write as _;\n        write!(&mut output, "{byte:02x}").expect("writing to String cannot fail");\n    }\n    output\n}\n\n'''
          if marker not in text:
              raise SystemExit("expected aer-exec helper insertion marker not found")
          text = text.replace(marker, helper + marker, 1)
          exec_path.write_text(text)

          env_path = Path("crates/aer-environment/src/lib.rs")
          text = env_path.read_text()
          text = text.replace(
              'use aer_exec::{CommandSpec, ExecutionPolicy, LocalProcessExecutor, SideEffectClass};',
              'use aer_exec::{\\n    CommandSpec, ExecutionPolicy, LocalProcessExecutor, SideEffectClass, lowercase_hex,\\n};',
              1,
          )
          text = text.replace('        format!("{:x}", hasher.finalize())', '        lowercase_hex(hasher.finalize().as_ref())', 1)
          text = text.replace('    format!("{:x}", Sha256::digest(bytes))', '    lowercase_hex(Sha256::digest(bytes).as_ref())', 1)
          if 'format!("{:x}"' in text:
              raise SystemExit("unexpected remaining aer-environment LowerHex digest formatting")
          env_path.write_text(text)

          workspace_path = Path("crates/aer-workspace/src/lib.rs")
          text = workspace_path.read_text()
          text = text.replace(
              'use aer_exec::{\\n    CommandSpec, ExecutionPolicy, LocalProcessExecutor, ProcessResult, SideEffectClass,\\n};',
              'use aer_exec::{\\n    CommandSpec, ExecutionPolicy, LocalProcessExecutor, ProcessResult, SideEffectClass, lowercase_hex,\\n};',
              1,
          )
          text = text.replace('    format!("sha256:{:x}", hasher.finalize())', '    format!("sha256:{}", lowercase_hex(hasher.finalize().as_ref()))', 1)
          text = text.replace('    format!("{:x}", Sha256::digest(bytes))', '    lowercase_hex(Sha256::digest(bytes).as_ref())', 1)
          if 'format!("{:x}"' in text or 'sha256:{:x}' in text:
              raise SystemExit("unexpected remaining aer-workspace LowerHex digest formatting")
          workspace_path.write_text(text)
          PY
          cargo +1.97.1 fmt --all
          git config user.name "everything-ci"
          git config user.email "everything-ci@users.noreply.github.com"
          git add crates/aer-exec crates/aer-environment crates/aer-workspace
          git commit -m "Fix Step 05 SHA-256 hex encoding [skip ci]"
          git push origin HEAD:main

      - name: Format
        if: runner.os != 'Windows'
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Workspace + execution boundary
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-exec -p aer-environment -p aer-workspace --all-targets

      - name: Durable state kernel
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-storage --all-targets

      - name: Documentation integrity
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-phase0-check -- --check

      - name: Canonical isolated Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1
