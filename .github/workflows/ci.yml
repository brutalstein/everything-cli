name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Resolve Step 03 dependency lock
        run: cargo +1.97.1 generate-lockfile

      - name: Persist Step 03 dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Lock Step 03 Rust dependencies [skip ci]"
          git push origin HEAD:main

      - name: Format
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Durable state kernel
        run: cargo +1.97.1 test --locked -p aer-storage --all-targets

      - name: Documentation integrity
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        run: cargo +1.97.1 run --locked -p aer-phase0-check -- --check
