name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format
        if: runner.os != 'Windows'
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Intent + Research + Engineering IR
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-domain -p aer-research -p aer-core --all-targets

      - name: Repository intelligence
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-repo -p aer-core --all-targets

      - name: Repository Intelligence 2.0 benchmark
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench

      - name: Repository Intelligence 2.0 Tier-2 topology
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_tier2

      - name: Long-horizon engineering state + recovery
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-core --test handoff_bench

      - name: Bounded parallel execution ResourceBench
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-core --test resource_bench

      - name: Context economy
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-context -p aer-repo -p aer-core --all-targets

      - name: Verification + proof integrity
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-core --all-targets verification

      - name: Provider resilience + cost router
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-provider --test provider_router_bench

      - name: Provider runtime + permission + tool substrate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test --locked -p aer-provider delegated
          cargo +1.97.1 test --locked -p aer-core permissions
          cargo +1.97.1 test --locked -p aer-core model_context
          cargo +1.97.1 test --locked -p aer-core tools
          cargo +1.97.1 test --locked -p everything provider_cli

      - name: Single-agent runtime 0.1
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-provider -p aer-core --all-targets

      - name: Workspace + execution boundary
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-exec -p aer-environment -p aer-workspace --all-targets

      - name: CLI product surface
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p everything --all-targets

      - name: Zero-redraw CLI guard
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.97.1 tree --locked -p everything | grep -E 'ratatui|crossterm'; then
            echo "retired TUI dependency returned to the everything dependency graph" >&2
            exit 1
          fi
          if cargo +1.97.1 tree --locked -p everything | grep -E '^\S*aer-bench'; then
            echo "measurement harness entered the shipped binary's dependency graph" >&2
            exit 1
          fi
          test ! -e crates/aer-cli/src/ui.rs
          test ! -e crates/aer-cli/src/app.rs
          test ! -e crates/aer-cli/src/launcher.rs
          test ! -e crates/aer-cli/src/theme.rs
          test ! -e crates/aer-cli/src/material_icons.rs
          test ! -e crates/aer-cli/assets

      - name: Durable state kernel
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-storage --all-targets

      - name: Documentation integrity
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-phase0-check -- --check

      - name: Canonical isolated Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1
