name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Repair test fixture visibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("crates/aer-cli/src/app.rs"); s=p.read_text(); old="#[cfg(test)]\nmod tests {"; new="#[cfg(test)]\npub(crate) mod tests {"; assert old in s; p.write_text(s.replace(old,new,1))'
          cargo +1.97.1 fmt --all
          git config user.name "everything-ci"
          git config user.email "everything-ci@users.noreply.github.com"
          git add crates/aer-cli/src/app.rs
          git commit -m "Expose shared TUI fixture inside test build [skip ci]"
          git push origin HEAD:main

      - name: Format
        if: runner.os != 'Windows'
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Single-agent runtime 0.1
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-provider -p aer-core --all-targets

      - name: Workspace + execution boundary
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-exec -p aer-environment -p aer-workspace --all-targets

      - name: Terminal product surface
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p everything --all-targets

      - name: Durable state kernel
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-storage --all-targets

      - name: Documentation integrity
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-phase0-check -- --check

      - name: Canonical isolated Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1
