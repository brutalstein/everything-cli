name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format
        if: runner.os != 'Windows'
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Single-agent runtime 0.1
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-provider -p aer-core --all-targets

      - name: Workspace + execution boundary
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-exec -p aer-environment -p aer-workspace --all-targets

      - name: Terminal product surface
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p everything --all-targets

      - name: Durable state kernel
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-storage --all-targets

      - name: Documentation integrity
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-phase0-check -- --check

      - name: Canonical isolated Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1
