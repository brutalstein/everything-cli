name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Canonicalize Step 07 backbone
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/step07_prepare.py
          cargo +1.97.1 fmt --all
          cargo +1.97.1 generate-lockfile
          git config user.name "everything-ci"
          git config user.email "everything-ci@users.noreply.github.com"
          git add Cargo.lock Cargo.toml crates/aer-domain crates/aer-contracts crates/aer-research crates/aer-core crates/aer-cli scripts/verify-windows.ps1
          if ! git diff --cached --quiet; then
            git commit -m "Canonicalize Step 07 product surface [skip ci]"
            git push origin HEAD:main
          fi

      - name: Format
        if: runner.os != 'Windows'
        run: cargo +1.97.1 fmt --all --check

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Intent + Research + Engineering IR
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-domain -p aer-research -p aer-core --all-targets

      - name: Single-agent runtime 0.1
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-provider -p aer-core --all-targets

      - name: Workspace + execution boundary
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-exec -p aer-environment -p aer-workspace --all-targets

      - name: Terminal product surface
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p everything --all-targets

      - name: Durable state kernel
        if: runner.os != 'Windows'
        run: cargo +1.97.1 test --locked -p aer-storage --all-targets

      - name: Documentation integrity
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check

      - name: Phase 0 executable contract gate
        if: runner.os != 'Windows'
        run: cargo +1.97.1 run --locked -p aer-phase0-check -- --check

      - name: Canonical isolated Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1
