name: provider-doc-closeout

on:
  push:
    branches: [agent/provider-doc-closeout]
    paths:
      - scripts/close_provider_docs.py
      - .github/workflows/provider-doc-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-doc-closeout
          fetch-depth: 0
      - name: Update provider closeout documentation
        run: python scripts/close_provider_docs.py
      - name: Normalize changed status header whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('STATUS.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          for index in range(min(15, len(lines))):
              lines[index] = lines[index].rstrip()
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Check textual diff
        run: git diff --check
      - name: Commit documentation and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md DEVELOPMENT_PLAN.md docs/45_PROVIDER_AUTH_CONTEXT_PERMISSION_AND_TOOL_RUNTIME.md docs/MANIFEST.sha256
          git rm scripts/close_provider_docs.py .github/workflows/provider-doc-closeout.yml
          git commit -m "Record provider live validation state"
          git push origin HEAD:agent/provider-doc-closeout
