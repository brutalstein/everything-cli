name: Step 12 Tier-2 finalize

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-tier2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Complete Tier-2 provenance and local dependency benchmark
        shell: python
        run: |
          from pathlib import Path
          import re

          model = Path('crates/aer-repo/src/ri2/model.rs')
          text = model.read_text(encoding='utf-8')
          view_block = text.split('pub struct ViewState', 1)[1].split('}', 1)[0]
          if 'pub environment_fingerprint: Option<String>,' not in view_block:
              text, count = re.subn(
                  r'(pub struct ViewState \{.*?    pub producer_version: String,\n)',
                  r'\1    pub environment_fingerprint: Option<String>,\n',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'ViewState patch count={count}')
          model.write_text(text, encoding='utf-8')

          graph = Path('crates/aer-repo/src/ri2/graph_write.rs')
          text = graph.read_text(encoding='utf-8')
          project_pattern = re.compile(
              r'    insert_view_state\(\n\s*tx,\n\s*snapshot_id,\n\s*"project",\n\s*CARGO_PRODUCER,\n\s*CARGO_PRODUCER_VERSION,\n\s*topology\.state,\n\s*CapabilityTier::Tier2Project,\n\s*\)\?;',
              re.S,
          )
          replacement = '''    insert_project_view_state(
              tx,
              snapshot_id,
              CARGO_PRODUCER,
              CARGO_PRODUCER_VERSION,
              topology.environment_fingerprint.as_deref(),
              topology.state,
          )?;'''
          text, count = project_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'project view patch count={count}')
          if 'fn insert_project_view_state(' not in text:
              marker = '\nstruct GraphNodeWriter'
              helper = '''

          fn insert_project_view_state(
              tx: &Transaction<'_>,
              snapshot_id: &str,
              producer_id: &str,
              producer_version: &str,
              environment_fingerprint: Option<&str>,
              freshness: FreshnessState,
          ) -> Result<(), RepoError> {
              tx.execute(
                  "INSERT INTO ri2_view_state(snapshot_id,view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier) VALUES(?,?,?,?,?,?,?)",
                  params![
                      snapshot_id,
                      "project",
                      producer_id,
                      producer_version,
                      environment_fingerprint,
                      freshness.as_str(),
                      i64::from(CapabilityTier::Tier2Project.as_u8())
                  ],
              )?;
              Ok(())
          }
          '''
              if marker not in text:
                  raise SystemExit('graph helper marker missing')
              text = text.replace(marker, helper + marker, 1)
          graph.write_text(text, encoding='utf-8')

          query = Path('crates/aer-repo/src/ri2/graph_query.rs')
          text = query.read_text(encoding='utf-8')
          text = text.replace(
              'SELECT view_name,producer_id,producer_version,freshness,capability_tier FROM ri2_view_state WHERE snapshot_id=? ORDER BY view_name',
              'SELECT view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier FROM ri2_view_state WHERE snapshot_id=? ORDER BY view_name',
              1,
          )
          row_pattern = re.compile(
              r'(row\.get::<_, String>\(0\)\?,\n\s*row\.get::<_, String>\(1\)\?,\n\s*row\.get::<_, String>\(2\)\?,\n)\s*row\.get::<_, String>\(3\)\?,\n\s*row\.get::<_, i64>\(4\)\?,',
          )
          text, count = row_pattern.subn(
              r'\1                row.get::<_, Option<String>>(3)?,\n                row.get::<_, String>(4)?,\n                row.get::<_, i64>(5)?,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'view row patch count={count}')
          text, count = re.subn(
              r'let \(view_name, producer_id, producer_version, freshness, tier\) = row\?;',
              'let (view_name, producer_id, producer_version, environment_fingerprint, freshness, tier) = row?;',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'view unpack patch count={count}')
          text, count = re.subn(
              r'(\s+producer_version,\n)(\s+freshness: FreshnessState::parse\(&freshness\)\?,)',
              r'\1                environment_fingerprint,\n\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'ViewState construction patch count={count}')
          query.write_text(text, encoding='utf-8')

          freshness = Path('crates/aer-repo/src/ri2/freshness.rs')
          text = freshness.read_text(encoding='utf-8')
          if 'use aer_environment::EnvironmentFingerprint;' not in text:
              text = 'use aer_environment::EnvironmentFingerprint;\n' + text
          start = text.find('        let project_producer = self')
          end = text.find('        let mut statement = self.connection.prepare(', start)
          if start < 0 or end < 0:
              raise SystemExit(f'project freshness bounds invalid start={start} end={end}')
          project_check = '''        let project_producer = self
              .connection
              .query_row(
                  "SELECT producer_id,producer_version,environment_fingerprint FROM ri2_view_state WHERE snapshot_id=? AND view_name='project'",
                  [snapshot_id],
                  |row| {
                      Ok((
                          row.get::<_, String>(0)?,
                          row.get::<_, String>(1)?,
                          row.get::<_, Option<String>>(2)?,
                      ))
                  },
              )
              .optional()?;
          if project_producer.as_ref().is_none_or(|(id, version, _)| {
              id != CARGO_PRODUCER || version != CARGO_PRODUCER_VERSION
          }) {
              return Ok(true);
          }
          if let Some((_, _, Some(stored_environment))) = project_producer {
              let repo_root: String = self.connection.query_row(
                  "SELECT repo_root FROM snapshots WHERE snapshot_id=?",
                  [snapshot_id],
                  |row| row.get(0),
              )?;
              let current_environment = match EnvironmentFingerprint::discover(repo_root) {
                  Ok(fingerprint) => fingerprint.digest,
                  Err(_) => return Ok(true),
              };
              if current_environment != stored_environment {
                  return Ok(true);
              }
          }

          '''
          text = text[:start] + project_check + text[end:]
          freshness.write_text(text, encoding='utf-8')

          bench = Path('crates/aer-repo/tests/repo_intel_2_bench.rs')
          text = bench.read_text(encoding='utf-8')
          if 'repo.join("helper/src")' not in text:
              text, count = re.subn(
                  r'(\s*fs::create_dir_all\(repo\.join\("web"\)\)\.expect\("web dir"\);\n)',
                  r'\1        fs::create_dir_all(repo.join("helper/src")).expect("helper src dir");\n',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'helper dir patch count={count}')
          manifest_pattern = re.compile(
              r'"\[package\]\\nname = \\"ri2-fixture\\"\\nversion = \\"0\.1\.0\\"\\nedition = \\"2024\\"\\n",'
          )
          text, count = manifest_pattern.subn(
              '"[workspace]\\\\nmembers = [\\\\"helper\\\\"]\\\\nresolver = \\\\"3\\\\"\\\\n\\\\n[package]\\\\nname = \\\\"ri2-fixture\\\\"\\\\nversion = \\\\"0.1.0\\\\"\\\\nedition = \\\\"2024\\\\"\\\\n\\\\n[dependencies]\\\\nhelper = { path = \\\\"helper\\\\" }\\\\n",',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'fixture manifest patch count={count}')
          lock_pattern = re.compile(
              r'"# This file is automatically @generated by Cargo\.\\n# It is not intended for manual editing\.\\nversion = 4\\n\\n\[\[package\]\]\\nname = \\"ri2-fixture\\"\\nversion = \\"0\.1\.0\\"\\n",'
          )
          text, count = lock_pattern.subn(
              '"# This file is automatically @generated by Cargo.\\\\n# It is not intended for manual editing.\\\\nversion = 4\\\\n\\\\n[[package]]\\\\nname = \\\\"helper\\\\"\\\\nversion = \\\\"0.1.0\\\\"\\\\n\\\\n[[package]]\\\\nname = \\\\"ri2-fixture\\\\"\\\\nversion = \\\\"0.1.0\\\\"\\\\ndependencies = [\\\\n \\\\"helper\\\\",\\\\n]\\\\n",',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'fixture lock patch count={count}')
          lock_marker = '        .expect("lockfile");\n'
          if text.count(lock_marker) != 1:
              raise SystemExit(f'lockfile marker count={text.count(lock_marker)}')
          helper_files = '''        .expect("lockfile");
              fs::write(
                  repo.join("helper/Cargo.toml"),
                  "[package]\\nname = \"helper\"\\nversion = \"0.1.0\"\\nedition = \"2024\"\\n",
              )
              .expect("helper manifest");
              fs::write(
                  repo.join("helper/src/lib.rs"),
                  "pub fn helper_marker() -> bool { true }\\n",
              )
              .expect("helper source");
          '''
          text = text.replace(lock_marker, helper_files, 1)
          text, count = re.subn(
              r'(view\.view_name == "project"\n\s*&& view\.freshness == FreshnessState::Current\n\s*&& view\.capability_tier == CapabilityTier::Tier2Project)',
              r'\1\n            && view.environment_fingerprint.is_some()',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'project view assertion patch count={count}')
          text, count = re.subn(
              r'assert_eq!\(packages\.len\(\), 1\);\n\s*assert_eq!\(packages\[0\]\.name, "ri2-fixture"\);',
              '''assert_eq!(packages.len(), 2);
              assert!(packages.iter().any(|package| package.name == "ri2-fixture"));
              assert!(packages.iter().any(|package| package.name == "helper"));
              let dependencies = index.project_dependencies(snapshot).expect("project dependencies");
              assert!(dependencies.iter().any(|dependency| {
                  dependency.target_name == "helper" && dependency.target_package_id.is_some()
              }));''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'package assertion patch count={count}')
          if 'simulate project environment drift' not in text:
              marker = '        .expect("simulate graph producer drift");\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'producer drift marker count={text.count(marker)}')
              text = text.replace(
                  marker,
                  marker + '''    connection
                  .execute(
                      "UPDATE ri2_view_state SET environment_fingerprint='stale-env-v0' WHERE snapshot_id=? AND view_name='project'",
                      [&snapshot],
                  )
                  .expect("simulate project environment drift");
          ''',
                  1,
              )
          bench.write_text(text, encoding='utf-8')
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Refresh lockfile for explicit workspace dependency
        run: cargo +1.97.1 check -p aer-repo
      - name: Frozen-lock lint
        run: cargo +1.97.1 clippy --locked -p aer-repo --all-targets -- -D warnings
      - name: RepoIntelBench
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench
      - name: Full aer-repo regression
        run: cargo +1.97.1 test --locked -p aer-repo --all-targets
      - name: Commit verified Tier-2 finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aer-repo
          git diff --cached --quiet && exit 0
          git commit -m "Finalize RI2 Tier-2 provenance and topology"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
