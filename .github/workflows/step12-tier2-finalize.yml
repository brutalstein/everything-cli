name: Step 12 Tier-2 finalize

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-tier2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Complete Tier-2 provenance and local dependency benchmark
        shell: python
        run: |
          from pathlib import Path

          # Public view state exposes environment provenance when a producer depends on it.
          model = Path('crates/aer-repo/src/ri2/model.rs')
          text = model.read_text(encoding='utf-8')
          if 'pub environment_fingerprint: Option<String>,' not in text.split('pub struct ViewState', 1)[1].split('}', 1)[0]:
              target = '    pub producer_version: String,\n    pub freshness: FreshnessState,\n'
              replacement = '    pub producer_version: String,\n    pub environment_fingerprint: Option<String>,\n    pub freshness: FreshnessState,\n'
              if target not in text:
                  raise SystemExit('ViewState target missing')
              text = text.replace(target, replacement, 1)
          model.write_text(text, encoding='utf-8')

          # Keep generic view-state writes backwards/simple; only project view carries env provenance.
          graph = Path('crates/aer-repo/src/ri2/graph_write.rs')
          text = graph.read_text(encoding='utf-8')
          old_project = '''    insert_view_state(
              tx,
              snapshot_id,
              "project",
              CARGO_PRODUCER,
              CARGO_PRODUCER_VERSION,
              topology.state,
              CapabilityTier::Tier2Project,
          )?;
          '''
          new_project = '''    insert_project_view_state(
              tx,
              snapshot_id,
              CARGO_PRODUCER,
              CARGO_PRODUCER_VERSION,
              topology.environment_fingerprint.as_deref(),
              topology.state,
          )?;
          '''
          if old_project not in text:
              raise SystemExit('project view-state call target missing')
          text = text.replace(old_project, new_project, 1)
          marker = '\nstruct GraphNodeWriter'
          if 'fn insert_project_view_state(' not in text:
              helper = '''

          fn insert_project_view_state(
              tx: &Transaction<'_>,
              snapshot_id: &str,
              producer_id: &str,
              producer_version: &str,
              environment_fingerprint: Option<&str>,
              freshness: FreshnessState,
          ) -> Result<(), RepoError> {
              tx.execute(
                  "INSERT INTO ri2_view_state(snapshot_id,view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier) VALUES(?,?,?,?,?,?,?)",
                  params![
                      snapshot_id,
                      "project",
                      producer_id,
                      producer_version,
                      environment_fingerprint,
                      freshness.as_str(),
                      i64::from(CapabilityTier::Tier2Project.as_u8())
                  ],
              )?;
              Ok(())
          }
          '''
              if marker not in text:
                  raise SystemExit('graph helper insertion marker missing')
              text = text.replace(marker, helper + marker, 1)
          graph.write_text(text, encoding='utf-8')

          # Read environment provenance through the public RI2 view state.
          query = Path('crates/aer-repo/src/ri2/graph_query.rs')
          text = query.read_text(encoding='utf-8')
          old_select = 'SELECT view_name,producer_id,producer_version,freshness,capability_tier FROM ri2_view_state WHERE snapshot_id=? ORDER BY view_name'
          new_select = 'SELECT view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier FROM ri2_view_state WHERE snapshot_id=? ORDER BY view_name'
          if old_select in text:
              text = text.replace(old_select, new_select, 1)
          old_rows = '''                row.get::<_, String>(2)?,
                          row.get::<_, String>(3)?,
                          row.get::<_, i64>(4)?,
          '''
          new_rows = '''                row.get::<_, String>(2)?,
                          row.get::<_, Option<String>>(3)?,
                          row.get::<_, String>(4)?,
                          row.get::<_, i64>(5)?,
          '''
          if old_rows not in text:
              raise SystemExit('view-state row mapping target missing')
          text = text.replace(old_rows, new_rows, 1)
          old_unpack = '            let (view_name, producer_id, producer_version, freshness, tier) = row?;'
          new_unpack = '            let (view_name, producer_id, producer_version, environment_fingerprint, freshness, tier) = row?;'
          if old_unpack not in text:
              raise SystemExit('view-state tuple unpack target missing')
          text = text.replace(old_unpack, new_unpack, 1)
          old_model = '''                producer_version,
                          freshness: FreshnessState::parse(&freshness)?,
          '''
          new_model = '''                producer_version,
                          environment_fingerprint,
                          freshness: FreshnessState::parse(&freshness)?,
          '''
          if old_model not in text:
              raise SystemExit('view-state model construction target missing')
          text = text.replace(old_model, new_model, 1)
          query.write_text(text, encoding='utf-8')

          # Same repository bytes are not current if the build-tool environment changed.
          freshness = Path('crates/aer-repo/src/ri2/freshness.rs')
          text = freshness.read_text(encoding='utf-8')
          if 'use aer_environment::EnvironmentFingerprint;' not in text:
              text = text.replace(
                  'use rusqlite::OptionalExtension;\n',
                  'use aer_environment::EnvironmentFingerprint;\nuse rusqlite::OptionalExtension;\n',
                  1,
              )
          old_project_check = '''        let project_producer = self
              .connection
              .query_row(
                  "SELECT producer_id,producer_version FROM ri2_view_state WHERE snapshot_id=? AND view_name='project'",
                  [snapshot_id],
                  |row| Ok((row.get::<_, String>(0)?, row.get::<_, String>(1)?)),
              )
              .optional()?;
          if project_producer
              .as_ref()
              .is_none_or(|(id, version)| id != CARGO_PRODUCER || version != CARGO_PRODUCER_VERSION)
          {
              return Ok(true);
          }
          '''
          new_project_check = '''        let project_producer = self
              .connection
              .query_row(
                  "SELECT producer_id,producer_version,environment_fingerprint FROM ri2_view_state WHERE snapshot_id=? AND view_name='project'",
                  [snapshot_id],
                  |row| {
                      Ok((
                          row.get::<_, String>(0)?,
                          row.get::<_, String>(1)?,
                          row.get::<_, Option<String>>(2)?,
                      ))
                  },
              )
              .optional()?;
          if project_producer.as_ref().is_none_or(|(id, version, _)| {
              id != CARGO_PRODUCER || version != CARGO_PRODUCER_VERSION
          }) {
              return Ok(true);
          }
          if let Some((_, _, Some(stored_environment))) = project_producer {
              let repo_root: String = self.connection.query_row(
                  "SELECT repo_root FROM snapshots WHERE snapshot_id=?",
                  [snapshot_id],
                  |row| row.get(0),
              )?;
              let current_environment = match EnvironmentFingerprint::discover(repo_root) {
                  Ok(fingerprint) => fingerprint.digest,
                  Err(_) => return Ok(true),
              };
              if current_environment != stored_environment {
                  return Ok(true);
              }
          }
          '''
          if old_project_check not in text:
              raise SystemExit('project freshness target missing')
          text = text.replace(old_project_check, new_project_check, 1)
          freshness.write_text(text, encoding='utf-8')

          # RepoIntelBench now exercises a real local Cargo workspace dependency, not a single-package toy.
          bench = Path('crates/aer-repo/tests/repo_intel_2_bench.rs')
          text = bench.read_text(encoding='utf-8')
          if 'repo.join("helper/src")' not in text:
              target = '        fs::create_dir_all(repo.join("web")).expect("web dir");\n'
              if target not in text:
                  raise SystemExit('fixture directory target missing')
              text = text.replace(target, target + '        fs::create_dir_all(repo.join("helper/src")).expect("helper src dir");\n', 1)
          old_manifest = '            "[package]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n",\n'
          new_manifest = '            "[workspace]\\nmembers = [\\"helper\\"]\\nresolver = \\"3\\"\\n\\n[package]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n\\n[dependencies]\\nhelper = { path = \\"helper\\" }\\n",\n'
          if old_manifest not in text:
              raise SystemExit('fixture manifest target missing')
          text = text.replace(old_manifest, new_manifest, 1)
          old_lock = '            "# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\n",\n'
          new_lock = '            "# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \\"helper\\"\\nversion = \\"0.1.0\\"\\n\\n[[package]]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\ndependencies = [\\n \\"helper\\",\\n]\\n",\n'
          if old_lock not in text:
              raise SystemExit('fixture lock target missing')
          text = text.replace(old_lock, new_lock, 1)
          lock_marker = '        .expect("lockfile");\n'
          if text.count(lock_marker) != 1:
              raise SystemExit(f'lockfile marker count={text.count(lock_marker)}')
          helper_files = '''        .expect("lockfile");
              fs::write(
                  repo.join("helper/Cargo.toml"),
                  "[package]\\nname = \\"helper\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n",
              )
              .expect("helper manifest");
              fs::write(
                  repo.join("helper/src/lib.rs"),
                  "pub fn helper_marker() -> bool { true }\\n",
              )
              .expect("helper source");
          '''
          text = text.replace(lock_marker, helper_files, 1)
          old_view = '''        view.view_name == "project"
                      && view.freshness == FreshnessState::Current
                      && view.capability_tier == CapabilityTier::Tier2Project
          '''
          new_view = '''        view.view_name == "project"
                      && view.freshness == FreshnessState::Current
                      && view.capability_tier == CapabilityTier::Tier2Project
                      && view.environment_fingerprint.is_some()
          '''
          if old_view not in text:
              raise SystemExit('project view assertion target missing')
          text = text.replace(old_view, new_view, 1)
          old_packages = '''    assert_eq!(packages.len(), 1);
              assert_eq!(packages[0].name, "ri2-fixture");
          '''
          new_packages = '''    assert_eq!(packages.len(), 2);
              assert!(packages.iter().any(|package| package.name == "ri2-fixture"));
              assert!(packages.iter().any(|package| package.name == "helper"));
              let dependencies = index.project_dependencies(snapshot).expect("project dependencies");
              assert!(dependencies.iter().any(|dependency| {
                  dependency.target_name == "helper" && dependency.target_package_id.is_some()
              }));
          '''
          if old_packages not in text:
              raise SystemExit('package assertions target missing')
          text = text.replace(old_packages, new_packages, 1)
          drift_marker = '        .expect("simulate graph producer drift");\n'
          if 'simulate project environment drift' not in text:
              if text.count(drift_marker) != 1:
                  raise SystemExit(f'producer drift marker count={text.count(drift_marker)}')
              env_drift = '''        .expect("simulate graph producer drift");
              connection
                  .execute(
                      "UPDATE ri2_view_state SET environment_fingerprint='stale-env-v0' WHERE snapshot_id=? AND view_name='project'",
                      [&snapshot],
                  )
                  .expect("simulate project environment drift");
          '''
              text = text.replace(drift_marker, env_drift, 1)
          bench.write_text(text, encoding='utf-8')
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Refresh lockfile for explicit workspace dependency
        run: cargo +1.97.1 check -p aer-repo
      - name: Frozen-lock lint
        run: cargo +1.97.1 clippy --locked -p aer-repo --all-targets -- -D warnings
      - name: RepoIntelBench
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench
      - name: Full aer-repo regression
        run: cargo +1.97.1 test --locked -p aer-repo --all-targets
      - name: Commit verified Tier-2 finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aer-repo
          git diff --cached --quiet && exit 0
          git commit -m "Finalize RI2 Tier-2 provenance and topology"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
