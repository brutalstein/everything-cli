name: terminal-cleanup-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove obsolete sidebar helpers
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/aer-cli/src/app.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace("    theme::{Glyphs, Theme},\n", "    theme::Theme,\n", 1)
          start = text.index("    pub(crate) const fn label(self) -> &'static str {")
          end = text.index("}\n\nimpl From<SlashTarget> for Screen", start)
          text = text[:start] + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format
        run: cargo +1.97.1 fmt --all

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-cli/src/app.rs
          git commit -m "Remove obsolete terminal sidebar helpers"
          git push origin HEAD:main
