name: provider-productize-repair

on:
  push:
    branches: [agent/provider-runtime-productization]
    paths: [scripts/provider_productize_repair.py]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-runtime-productization
          fetch-depth: 0
      - run: python scripts/provider_productize_repair.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-provider/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "Repair provider fixture constructor"
          git push origin HEAD:agent/provider-runtime-productization
