name: provider-productize-repair

on:
  push:
    branches: [agent/provider-runtime-productization]
    paths: [scripts/provider_productize_repair.py]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-runtime-productization
          fetch-depth: 0
      - run: python scripts/provider_productize_repair.py
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo +1.97.1 fmt --all
      - name: Commit repair and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-provider/src crates/aer-core/src crates/aer-cli/src
          git diff --cached --quiet && exit 0
          git commit -m "Repair and format provider productization source"
          git push origin HEAD:agent/provider-runtime-productization
