name: Context Economy V2 Docs

on:
  push:
    branches:
      - agent/context-economy-v2-docs
    paths:
      - .aer-dev/apply-context-v2-docs.py
      - .github/workflows/context-economy-v2-docs.yml
  pull_request:
    branches:
      - feat/context-economy-v2

permissions:
  contents: write

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-economy-v2-docs
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Apply ownership documentation and refresh manifest
        run: python3 .aer-dev/apply-context-v2-docs.py
      - name: Documentation integrity
        run: cargo +1.97.1 run --locked -p aer-doc-check --quiet
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated docs
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aer-dev
          rm -f .github/workflows/context-economy-v2-docs.yml
          git config user.name "aer-context-v2-bot"
          git config user.email "aer-context-v2@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: document Context Economy V2 ownership and evidence"
          git push origin HEAD:agent/context-economy-v2-docs
