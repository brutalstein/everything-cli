name: Context Economy V2 Manifest

on:
  push:
    branches:
      - agent/context-economy-v2-manifest
    paths:
      - .github/workflows/context-economy-v2-manifest.yml
  pull_request:
    branches:
      - feat/context-economy-v2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-economy-v2-manifest
          fetch-depth: 0
      - name: Regenerate docs manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          docs = root / 'docs'
          paths = sorted(
              p for p in docs.rglob('*')
              if p.is_file() and p.as_posix() != 'docs/MANIFEST.sha256'
          )
          lines = []
          for path in paths:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.as_posix()}")
          (docs / 'MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify documentation integrity
        run: cargo +1.97.1 run --locked -p aer-doc-check -- --check
      - name: Commit manifest only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/context-economy-v2-manifest.yml
          git config user.name "aer-context-v2-bot"
          git config user.email "aer-context-v2@users.noreply.github.com"
          git add docs/MANIFEST.sha256 .github/workflows/context-economy-v2-manifest.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "manifest_changes=0"
            exit 0
          fi
          git commit -m "docs: regenerate documentation manifest"
          git push origin HEAD:agent/context-economy-v2-manifest
