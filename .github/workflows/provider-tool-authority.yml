name: provider-tool-authority

on:
  push:
    branches: [agent/provider-runtime-productization]
    paths: [scripts/provider_tool_authority.py]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-runtime-productization
          fetch-depth: 0
      - run: python scripts/provider_tool_authority.py
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo +1.97.1 fmt --all
      - name: Commit ToolBroker authority hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-core/src/tools.rs docs/45_PROVIDER_AUTH_CONTEXT_PERMISSION_AND_TOOL_RUNTIME.md docs/MANIFEST.sha256 STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Require owned worktree authority for process tools"
          git push origin HEAD:agent/provider-runtime-productization
