name: Context Economy V2 Stage4

on:
  push:
    branches:
      - agent/context-economy-v2-stage2
    paths:
      - crates/aer-context/tests/context_economy_v2_offline.rs
      - crates/aer-core/tests/compact_edit_economy.rs
      - crates/aer-provider/tests/context_assembly_v2.rs
      - crates/aer-repo/tests/ri2_capsule.rs
      - .github/workflows/context-economy-v2-stage4.yml
  pull_request:
    branches:
      - feat/context-economy-v2

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-economy-v2-stage2
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format check
        run: cargo +1.97.1 fmt --all --check
      - name: Clippy new economy surfaces
        run: cargo +1.97.1 clippy --locked -p aer-context -p aer-core -p aer-provider -p aer-repo --all-targets -- -D warnings
      - name: Context Economy V2 enterprise-scale offline gates
        run: cargo +1.97.1 test --locked -p aer-context --test context_economy_v2_offline -- --nocapture
      - name: Compact edit output economy
        run: cargo +1.97.1 test --locked -p aer-core --test compact_edit_economy -- --nocapture
      - name: Provider cache assembly geometry
        run: cargo +1.97.1 test --locked -p aer-provider --test context_assembly_v2 -- --nocapture
      - name: RI2 capsule provenance
        run: cargo +1.97.1 test --locked -p aer-repo --test ri2_capsule -- --nocapture
      - name: Provider-call budget guard
        run: echo "offline_stage=true provider_calls=0"
