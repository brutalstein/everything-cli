name: step09-finalize-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Apply fail-closed and checked-accounting repairs
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/aer-context/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "            if let Ok(value) = self.materialize(workspace_root, index, snapshot_id, candidate) {\n"
                  "                materialized.push(value);\n"
                  "            } else if mandatory_paths.contains(&candidate.path) {\n"
                  "                self.materialize(workspace_root, index, snapshot_id, candidate)?;\n"
                  "            }\n",
                  "            match self.materialize(workspace_root, index, snapshot_id, candidate) {\n"
                  "                Ok(value) => materialized.push(value),\n"
                  "                Err(ContextError::SourceTooLarge { .. } | ContextError::SourceNotRetrievable(_))\n"
                  "                    if !mandatory_paths.contains(&candidate.path) => {}\n"
                  "                Err(error) => return Err(error),\n"
                  "            }\n",
              ),
              (
                  "    let recall_milli = if relevant_total == 0 {\n"
                  "        1000\n"
                  "    } else {\n"
                  "        u16::try_from(relevant_selected.saturating_mul(1000) / relevant_total).unwrap_or(1000)\n"
                  "    };\n",
                  "    let recall_milli = relevant_selected\n"
                  "        .saturating_mul(1000)\n"
                  "        .checked_div(relevant_total)\n"
                  "        .map_or(1000, |value| u16::try_from(value).unwrap_or(1000));\n",
              ),
              (
                  "        assert!(end - start + 1 <= 80);\n",
                  "        assert!(end - start < 80);\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected repair target not found: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Canonical formatting
        run: cargo +1.97.1 fmt --all

      - name: Refresh lockfile and compile workspace
        run: cargo +1.97.1 check --workspace

      - name: Deny warnings
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Context Economy focused tests
        run: cargo +1.97.1 test -p aer-context -p aer-repo -p aer-core --all-targets

      - name: Full workspace tests
        run: cargo +1.97.1 test --workspace --all-targets

      - name: Commit verified Step 09 activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aer-context crates/aer-core/src/context.rs crates/aer-core/src/root.rs crates/aer-core/Cargo.toml Cargo.toml
          if git diff --cached --quiet; then
            echo "No Step 09 finalize changes required."
            exit 0
          fi
          git commit -m "Finalize Context Economy Engine activation"
          git push origin HEAD:main
