name: step09-finalize-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Apply exact source identity repair
        run: python scripts/step09_exact_patch.py

      - name: Canonical formatting
        run: cargo +1.97.1 fmt --all

      - name: Compile workspace
        run: cargo +1.97.1 check --locked --workspace

      - name: Deny warnings
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Context Economy focused tests
        run: cargo +1.97.1 test --locked -p aer-context -p aer-repo -p aer-core --all-targets

      - name: Full workspace tests
        run: cargo +1.97.1 test --locked --workspace --all-targets

      - name: Commit verified exact-identity hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-repo/src/lib.rs crates/aer-repo/tests/hardening.rs crates/aer-context/src/lib.rs
          if git diff --cached --quiet; then
            echo "No exact-identity changes required."
            exit 0
          fi
          git commit -m "Use exact repository identity for Context Packs"
          git push origin HEAD:main
