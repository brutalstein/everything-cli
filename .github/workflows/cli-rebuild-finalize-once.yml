name: cli-rebuild-finalize-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Remove retired TUI dependencies
        shell: python
        run: |
          from pathlib import Path

          root = Path("Cargo.toml")
          text = root.read_text(encoding="utf-8")
          text = text.replace('crossterm = "=0.29.0"\n', '')
          text = text.replace('ratatui = "=0.30.2"\n', '')
          root.write_text(text, encoding="utf-8")

          cli = Path("crates/aer-cli/Cargo.toml")
          text = cli.read_text(encoding="utf-8")
          text = text.replace('crossterm.workspace = true\n', '')
          text = text.replace('ratatui.workspace = true\n', '')
          text = text.replace('sha2.workspace = true\n', '')
          cli.write_text(text, encoding="utf-8")

      - name: Canonical formatting
        run: cargo +1.97.1 fmt --all

      - name: Refresh lockfile after dependency removal
        run: cargo +1.97.1 check --workspace

      - name: Deny warnings
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Full workspace tests
        run: cargo +1.97.1 test --workspace --all-targets

      - name: Commit verified CLI rebuild
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/aer-cli/Cargo.toml crates/aer-cli/src/commands.rs crates/aer-cli/src/shell.rs
          if git diff --cached --quiet; then
            echo "No finalize changes required."
            exit 0
          fi
          git commit -m "Finalize zero-redraw CLI rebuild"
          git push origin HEAD:main
