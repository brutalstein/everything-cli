name: step10-format-repair

on:
  push:
    branches:
      - agent/step-10-verification-proof-system

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/step-10-verification-proof-system

      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +1.97.1 fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "everything-ci"
          git config user.email "everything-ci@users.noreply.github.com"
          git add crates/aer-core/src/verification.rs crates/aer-core/src/root.rs
          git commit -m "Format Step 10 verification code"
          git push origin HEAD:agent/step-10-verification-proof-system
