name: provider-final-format

on:
  push:
    branches: [agent/provider-runtime-productization]
    paths: [scripts/provider_final_format.txt]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-runtime-productization
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo +1.97.1 fmt --all
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/aer-doc-check/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "Format docs inventory acceptance update"
          git push origin HEAD:agent/provider-runtime-productization
