name: Step 11 clippy repair

on:
  push:
    branches:
      - agent/step-11-provider-resilience-cost-router
    paths:
      - '.github/workflows/step11-clippy-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-11-provider-resilience-cost-router
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Apply exact Clippy simplifications
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/aer-provider/src/routing.rs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '#[derive(Clone, Debug, Eq, PartialEq)]\npub struct RateLimitWindow {',
              '#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub struct RateLimitWindow {',
              1,
          )
          old_default = '''impl Default for RateLimitWindow {
              fn default() -> Self {
                  Self {
                      remaining_requests: None,
                      remaining_tokens: None,
                      reset_at_ms: None,
                  }
              }
          }

          '''
          if old_default not in text:
              raise SystemExit('RateLimitWindow Default target not found')
          text = text.replace(old_default, '', 1)

          old_region = '''    if let Some(required_region) = &request.requirements.required_region {
              if candidate.region.as_ref() != Some(required_region)
                  || (!candidate.privacy.allowed_regions.is_empty()
                      && !candidate.privacy.allowed_regions.contains(required_region))
              {
                  return Err(RejectionReason::RegionPolicy);
              }
          }
          '''
          new_region = '''    if let Some(required_region) = &request.requirements.required_region
              && (candidate.region.as_ref() != Some(required_region)
                  || (!candidate.privacy.allowed_regions.is_empty()
                      && !candidate.privacy.allowed_regions.contains(required_region)))
          {
              return Err(RejectionReason::RegionPolicy);
          }
          '''
          if old_region not in text:
              raise SystemExit('region eligibility target not found')
          text = text.replace(old_region, new_region, 1)

          old_snapshot = '''    if let Some(required_snapshot) = &request.requirements.pinned_model_snapshot {
              if candidate.model_snapshot.as_ref() != Some(required_snapshot) {
                  return Err(RejectionReason::SnapshotMismatch);
              }
          }
          '''
          new_snapshot = '''    if let Some(required_snapshot) = &request.requirements.pinned_model_snapshot
              && candidate.model_snapshot.as_ref() != Some(required_snapshot)
          {
              return Err(RejectionReason::SnapshotMismatch);
          }
          '''
          if old_snapshot not in text:
              raise SystemExit('snapshot eligibility target not found')
          text = text.replace(old_snapshot, new_snapshot, 1)

          path.write_text(text, encoding='utf-8')
      - name: Format
        run: cargo +1.97.1 fmt --all
      - name: Lint provider
        run: cargo +1.97.1 clippy --locked -p aer-provider --all-targets -- -D warnings
      - name: Test provider
        run: cargo +1.97.1 test --locked -p aer-provider --all-targets
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-provider/src/routing.rs
          git diff --cached --quiet && exit 0
          git commit -m "Resolve Step 11 provider lint findings"
          git push origin HEAD:agent/step-11-provider-resilience-cost-router
