name: Step 11 clippy repair

on:
  push:
    branches:
      - agent/step-11-provider-resilience-cost-router
    paths:
      - '.github/workflows/step11-clippy-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-11-provider-resilience-cost-router
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Apply exact Clippy simplifications
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('crates/aer-provider/src/routing.rs')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r'#\[derive\(Clone, Debug, Eq, PartialEq\)\]\npub struct RateLimitWindow \{',
              '#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub struct RateLimitWindow {',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('RateLimitWindow derive target not found')

          text, count = re.subn(
              r'impl Default for RateLimitWindow \{.*?\n\}\n\n(?=impl RateLimitWindow)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('RateLimitWindow Default target not found')

          region_pattern = re.compile(
              r'''    if let Some\(required_region\) = &request\.requirements\.required_region \{\n'''
              r'''\s+if candidate\.region\.as_ref\(\) != Some\(required_region\)\n'''
              r'''\s+\|\| \(!candidate\.privacy\.allowed_regions\.is_empty\(\)\n'''
              r'''\s+&& !candidate\.privacy\.allowed_regions\.contains\(required_region\)\)\n'''
              r'''\s+\{\n\s+return Err\(RejectionReason::RegionPolicy\);\n\s+\}\n    \}'''
          )
          region_replacement = '''    if let Some(required_region) = &request.requirements.required_region
              && (candidate.region.as_ref() != Some(required_region)
                  || (!candidate.privacy.allowed_regions.is_empty()
                      && !candidate.privacy.allowed_regions.contains(required_region)))
          {
              return Err(RejectionReason::RegionPolicy);
          }'''
          text, count = region_pattern.subn(region_replacement, text, count=1)
          if count != 1:
              raise SystemExit('region eligibility target not found')

          snapshot_pattern = re.compile(
              r'''    if let Some\(required_snapshot\) = &request\.requirements\.pinned_model_snapshot \{\n'''
              r'''\s+if candidate\.model_snapshot\.as_ref\(\) != Some\(required_snapshot\) \{\n'''
              r'''\s+return Err\(RejectionReason::SnapshotMismatch\);\n\s+\}\n    \}'''
          )
          snapshot_replacement = '''    if let Some(required_snapshot) = &request.requirements.pinned_model_snapshot
              && candidate.model_snapshot.as_ref() != Some(required_snapshot)
          {
              return Err(RejectionReason::SnapshotMismatch);
          }'''
          text, count = snapshot_pattern.subn(snapshot_replacement, text, count=1)
          if count != 1:
              raise SystemExit('snapshot eligibility target not found')

          path.write_text(text, encoding='utf-8')
      - name: Format
        run: cargo +1.97.1 fmt --all
      - name: Lint provider
        run: cargo +1.97.1 clippy --locked -p aer-provider --all-targets -- -D warnings
      - name: Test provider
        run: cargo +1.97.1 test --locked -p aer-provider --all-targets
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-provider/src/routing.rs
          git diff --cached --quiet && exit 0
          git commit -m "Resolve Step 11 provider lint findings"
          git push origin HEAD:agent/step-11-provider-resilience-cost-router
