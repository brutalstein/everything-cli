name: provider-finalize

on:
  push:
    branches: [agent/provider-runtime-productization]
    paths: [scripts/provider_finalize.py]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-runtime-productization
          fetch-depth: 0
      - run: python scripts/provider_finalize.py
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo +1.97.1 fmt --all
      - name: Commit provider productization finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md docs/MANIFEST.sha256 docs/37_PROVIDER_GATEWAY_AND_RESILIENCE.md docs/14_TOOLS_MCP_A2A_AND_SKILLS.md docs/23_CLI_AND_USER_EXPERIENCE.md docs/29_CONFIGURATION_AND_POLICY_MODEL.md scripts/verify-windows.ps1
          git diff --cached --quiet && exit 0
          git commit -m "Finalize provider productization acceptance surfaces"
          git push origin HEAD:agent/provider-runtime-productization
