name: step08-finalize-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Activate and harden repository intelligence
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected activation anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "Cargo.toml",
              '    "crates/aer-core",\n    "crates/aer-cli",',
              '    "crates/aer-core",\n    "crates/aer-repo",\n    "crates/aer-cli",',
          )
          replace(
              "Cargo.toml",
              'sha2 = "=0.11.0"\nulid = "=3.0.0"',
              'sha2 = "=0.11.0"\ntree-sitter = "=0.26.11"\ntree-sitter-javascript = "=0.25.0"\ntree-sitter-python = "=0.25.0"\ntree-sitter-rust = "=0.24.2"\ntree-sitter-typescript = "=0.23.2"\nulid = "=3.0.0"',
          )
          replace(
              "crates/aer-core/Cargo.toml",
              'aer-research = { path = "../aer-research" }',
              'aer-repo = { path = "../aer-repo" }\naer-research = { path = "../aer-research" }',
          )
          replace(
              "crates/aer-core/src/root.rs",
              'pub use phase1_runtime::*;\npub mod spec;',
              'pub use phase1_runtime::*;\npub mod repository;\npub mod spec;',
          )

          lib = Path("crates/aer-repo/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = text.replace('    ffi::OsString,\n', '')
          text = text.replace(
              'use aer_workspace::{SnapshotPolicy, WorkspaceIdentity, WorkspaceSnapshot};',
              'use aer_workspace::{SnapshotPolicy, WorkspaceSnapshot};',
          )
          old_hash = '            let hash: Option<String> = tx.query_row("SELECT content_sha256 FROM snapshot_files WHERE snapshot_id=? AND path=?", params![snapshot_id, observation.path], |row| row.get(0)).optional()?;'
          new_hash = '            let hash = tx\n                .query_row(\n                    "SELECT content_sha256 FROM snapshot_files WHERE snapshot_id=? AND path=?",\n                    params![snapshot_id, observation.path],\n                    |row| row.get::<_, Option<String>>(0),\n                )\n                .optional()?\n                .flatten();'
          if old_hash not in text:
              raise SystemExit("runtime observation hash anchor missing")
          text = text.replace(old_hash, new_hash, 1)

          old_fixture = 'let root=std::env::temp_dir().join(format!("aer-repo-{now}-{nonce}"));fs::create_dir_all(root.join("src")).unwrap();fs::create_dir_all(root.join("tests")).unwrap();'
          new_fixture = 'let base=std::env::temp_dir().join(format!("aer-repo-{now}-{nonce}"));let root=base.join("repo");fs::create_dir_all(root.join("src")).unwrap();fs::create_dir_all(root.join("tests")).unwrap();'
          if old_fixture not in text:
              raise SystemExit("fixture root anchor missing")
          text = text.replace(old_fixture, new_fixture, 1)
          old_index = 'let index=root.join(".index.sqlite");Self{root,index}'
          new_index = 'let index=base.join("index.sqlite");Self{root,index}'
          if old_index not in text:
              raise SystemExit("fixture index anchor missing")
          text = text.replace(old_index, new_index, 1)
          old_drop = 'impl Drop for Fixture{fn drop(&mut self){let _=fs::remove_dir_all(&self.root);}}'
          new_drop = 'impl Drop for Fixture{fn drop(&mut self){if let Some(base)=self.root.parent(){let _=fs::remove_dir_all(base);}}}'
          if old_drop not in text:
              raise SystemExit("fixture drop anchor missing")
          text = text.replace(old_drop, new_drop, 1)

          old_prune = 'fn prune_snapshots(tx:&Transaction<\'_>,repo_id:&str,retain:usize)->Result<(),RepoError>{let mut statement=tx.prepare("SELECT snapshot_id FROM snapshots WHERE repo_id=? ORDER BY created_at DESC,snapshot_id DESC")?;let ids=statement.query_map([repo_id],|row|row.get::<_,String>(0))?.collect::<Result<Vec<_>,_>>()?;for id in ids.into_iter().skip(retain){tx.execute("DELETE FROM snapshots WHERE snapshot_id=?",[id])?;}Ok(())}'
          new_prune = '''fn prune_snapshots(\n    tx: &Transaction<'_>,\n    repo_id: &str,\n    retain: usize,\n) -> Result<(), RepoError> {\n    let current: Option<String> = tx\n        .query_row(\n            "SELECT snapshot_id FROM current_snapshots WHERE repo_id=?",\n            [repo_id],\n            |row| row.get(0),\n        )\n        .optional()?;\n    let mut statement = tx.prepare(\n        "SELECT snapshot_id FROM snapshots WHERE repo_id=? AND snapshot_id<>COALESCE(?, '') ORDER BY created_at DESC,snapshot_id DESC",\n    )?;\n    let ids = statement\n        .query_map(params![repo_id, current], |row| row.get::<_, String>(0))?\n        .collect::<Result<Vec<_>, _>>()?;\n    for id in ids.into_iter().skip(retain.saturating_sub(1)) {\n        tx.execute("DELETE FROM snapshots WHERE snapshot_id=?", [id])?;\n    }\n    Ok(())\n}'''
          if old_prune not in text:
              raise SystemExit("snapshot prune anchor missing")
          text = text.replace(old_prune, new_prune, 1)
          lib.write_text(text, encoding="utf-8")

      - name: Canonical formatting
        run: cargo +1.97.1 fmt --all

      - name: Resolve dependency graph
        run: cargo +1.97.1 check --workspace --all-targets

      - name: Deny warnings
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Repository intelligence tests
        run: cargo +1.97.1 test -p aer-repo -p aer-core --all-targets

      - name: Full workspace tests
        run: cargo +1.97.1 test --workspace --all-targets

      - name: Commit verified Step 08 activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/aer-core/Cargo.toml crates/aer-core/src/root.rs crates/aer-core/src/repository.rs crates/aer-repo
          if git diff --cached --quiet; then
            echo "No activation changes required."
            exit 0
          fi
          git commit -m "Activate Step 08 repository intelligence"
          git push origin HEAD:main
