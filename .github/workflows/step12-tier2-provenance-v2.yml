name: Step 12 Tier 2 provenance v2

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-tier2-provenance-v2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Complete environment-bound project topology
        shell: python
        run: |
          from pathlib import Path
          import re

          model = Path('crates/aer-repo/src/ri2/model.rs')
          text = model.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(pub struct ViewState \{\n(?:.*\n)*?    pub producer_version: String,\n)',
              r'\1    pub environment_fingerprint: Option<String>,\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'ViewState environment field count={count}')
          model.write_text(text, encoding='utf-8')

          build = Path('crates/aer-repo/src/ri2/build.rs')
          text = build.read_text(encoding='utf-8')
          if 'use aer_environment::EnvironmentFingerprint;' not in text:
              text = text.replace(
                  'use aer_exec::{CommandSpec, ExecutionPolicy, LocalProcessExecutor, SideEffectClass};',
                  'use aer_environment::EnvironmentFingerprint;\nuse aer_exec::{CommandSpec, ExecutionPolicy, LocalProcessExecutor, SideEffectClass};',
                  1,
              )
          text, count = re.subn(
              r'(pub\(crate\) struct BuildTopology \{\n    pub state: FreshnessState,\n)',
              r'\1    pub environment_fingerprint: Option<String>,\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'BuildTopology field count={count}')
          text, count = re.subn(
              r'(fn unavailable\(\) -> Self \{\n        Self \{\n            state: FreshnessState::Unavailable,\n)',
              r'\1            environment_fingerprint: None,\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'BuildTopology unavailable count={count}')
          text, count = re.subn(
              r'(pub\(crate\) fn collect_project_topology\(repo: &Path, policy: &IndexPolicy\) -> BuildTopology \{\n    if !repo\.join\("Cargo\.toml"\)\.is_file\(\) \{\n        return BuildTopology::unavailable\(\);\n    \}\n)',
              r'\1    let environment_fingerprint = match EnvironmentFingerprint::discover(repo) {\n        Ok(fingerprint) => Some(fingerprint.digest_hex()),\n        Err(_) => return BuildTopology::unavailable(),\n    };\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'collect environment count={count}')
          # Every failure after environment discovery retains that digest so an unavailable view does not thrash.
          collect_start = text.index('pub(crate) fn collect_project_topology')
          parse_start = text.index('fn parse_cargo_metadata', collect_start)
          collect = text[collect_start:parse_start]
          collect = collect.replace(
              'return BuildTopology::unavailable();',
              'return BuildTopology { environment_fingerprint: environment_fingerprint.clone(), ..BuildTopology::unavailable() };',
          )
          # Restore the pre-discovery Cargo.toml absence path to a plain unavailable value.
          collect = collect.replace(
              'if !repo.join("Cargo.toml").is_file() {\n        return BuildTopology { environment_fingerprint: environment_fingerprint.clone(), ..BuildTopology::unavailable() };\n    }',
              'if !repo.join("Cargo.toml").is_file() {\n        return BuildTopology::unavailable();\n    }',
          )
          collect = collect.replace(
              'Err(_) => return BuildTopology { environment_fingerprint: environment_fingerprint.clone(), ..BuildTopology::unavailable() },',
              'Err(_) => return BuildTopology::unavailable(),',
          )
          collect = collect.replace(
              'parse_cargo_metadata(repo, &root).unwrap_or_else(|_| BuildTopology::unavailable())',
              'parse_cargo_metadata(repo, &root, environment_fingerprint.clone()).unwrap_or_else(|_| BuildTopology { environment_fingerprint, ..BuildTopology::unavailable() })',
          )
          text = text[:collect_start] + collect + text[parse_start:]
          text, count = re.subn(
              r'fn parse_cargo_metadata\(repo: &Path, root: &Value\) -> Result<BuildTopology, RepoError> \{',
              'fn parse_cargo_metadata(\n    repo: &Path,\n    root: &Value,\n    environment_fingerprint: Option<String>,\n) -> Result<BuildTopology, RepoError> {',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'parse_cargo_metadata signature count={count}')
          text, count = re.subn(
              r'(Ok\(BuildTopology \{\n        state: FreshnessState::Current,\n)',
              r'\1        environment_fingerprint,\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'BuildTopology success count={count}')
          build.write_text(text, encoding='utf-8')

          graph = Path('crates/aer-repo/src/ri2/graph_write.rs')
          text = graph.read_text(encoding='utf-8')
          # Add the environment argument to every insert_view_state call based on the project/non-project view name.
          text = text.replace(
              '''        topology.state,
                      CapabilityTier::Tier2Project,
                  )?;''',
              '''        topology.state,
                      CapabilityTier::Tier2Project,
                      topology.environment_fingerprint.as_deref(),
                  )?;''',
              1,
          )
          for view in ['lexical', 'syntax', 'precise_semantic', 'runtime', 'graph']:
              pattern = re.compile(
                  rf'(insert_view_state\(\n\s*tx,\n\s*snapshot_id,\n\s*"{view}",.*?\n\s*CapabilityTier::[A-Za-z0-9_]+,\n)(\s*\)\?;)',
                  re.S,
              )
              text, count = pattern.subn(r'\1        None,\n\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'insert_view_state {view} arg count={count}')
          sig = re.compile(
              r'(fn insert_view_state\(.*?    freshness: FreshnessState,\n    tier: CapabilityTier,\n)(\) -> Result<(), RepoError> \{\n    tx\.execute\(\n        "INSERT INTO ri2_view_state\(snapshot_id,view_name,producer_id,producer_version,freshness,capability_tier\) VALUES\(\?,\?,\?,\?,\?,\?\)",\n        params!\[\n            snapshot_id,\n            view_name,\n            producer_id,\n            producer_version,\n)(            freshness\.as_str\(\),\n            i64::from\(tier\.as_u8\(\)\)\n        \],)',
              re.S,
          )
          replacement = r'''\1    environment_fingerprint: Option<&str>,
\2            environment_fingerprint,
\3'''
          text, count = sig.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'insert_view_state signature/sql count={count}')
          text = text.replace(
              'ri2_view_state(snapshot_id,view_name,producer_id,producer_version,freshness,capability_tier) VALUES(?,?,?,?,?,?)',
              'ri2_view_state(snapshot_id,view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier) VALUES(?,?,?,?,?,?,?)',
              1,
          )
          graph.write_text(text, encoding='utf-8')

          query = Path('crates/aer-repo/src/ri2/graph_query.rs')
          text = query.read_text(encoding='utf-8')
          text = text.replace(
              'SELECT view_name,producer_id,producer_version,freshness,capability_tier FROM ri2_view_state',
              'SELECT view_name,producer_id,producer_version,environment_fingerprint,freshness,capability_tier FROM ri2_view_state',
              1,
          )
          text, count = re.subn(
              r'(row\.get::<_, String>\(2\)\?,\n)(\s*row\.get::<_, String>\(3\)\?,\n\s*row\.get::<_, i64>\(4\)\?,)',
              r'\1                row.get::<_, Option<String>>(3)?,\n                row.get::<_, String>(4)?,\n                row.get::<_, i64>(5)?,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'view query tuple count={count}')
          text = text.replace(
              'let (view_name, producer_id, producer_version, freshness, tier) = row?;',
              'let (view_name, producer_id, producer_version, environment_fingerprint, freshness, tier) = row?;',
              1,
          )
          text = text.replace(
              '            producer_version,\n            freshness: FreshnessState::parse(&freshness)?,',
              '            producer_version,\n            environment_fingerprint,\n            freshness: FreshnessState::parse(&freshness)?,',
              1,
          )
          query.write_text(text, encoding='utf-8')

          freshness = Path('crates/aer-repo/src/ri2/freshness.rs')
          text = freshness.read_text(encoding='utf-8')
          if 'use aer_environment::EnvironmentFingerprint;' not in text:
              text = text.replace('use rusqlite::OptionalExtension;', 'use aer_environment::EnvironmentFingerprint;\nuse rusqlite::OptionalExtension;', 1)
          pattern = re.compile(
              r'        let project_producer = self.*?        if project_producer\.as_ref\(\)\.is_none_or\(\|\(id, version\)\| \{\n            id != CARGO_PRODUCER \|\| version != CARGO_PRODUCER_VERSION\n        \}\) \{\n            return Ok\(true\);\n        \}\n',
              re.S,
          )
          replacement = '''        let project_producer = self
              .connection
              .query_row(
                  "SELECT producer_id,producer_version,environment_fingerprint FROM ri2_view_state WHERE snapshot_id=? AND view_name='project'",
                  [snapshot_id],
                  |row| {
                      Ok((
                          row.get::<_, String>(0)?,
                          row.get::<_, String>(1)?,
                          row.get::<_, Option<String>>(2)?,
                      ))
                  },
              )
              .optional()?;
          if project_producer.as_ref().is_none_or(|(id, version, _)| {
              id != CARGO_PRODUCER || version != CARGO_PRODUCER_VERSION
          }) {
              return Ok(true);
          }
          if let Some((_, _, Some(stored_environment))) = project_producer {
              let repo_root: String = self.connection.query_row(
                  "SELECT repo_root FROM snapshots WHERE snapshot_id=?",
                  [snapshot_id],
                  |row| row.get(0),
              )?;
              let current_environment = EnvironmentFingerprint::discover(repo_root)?.digest_hex();
              if current_environment != stored_environment {
                  return Ok(true);
              }
          }
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'project freshness replacement count={count}')
          freshness.write_text(text, encoding='utf-8')

          bench = Path('crates/aer-repo/tests/repo_intel_2_bench.rs')
          text = bench.read_text(encoding='utf-8')
          text = text.replace(
              '        fs::create_dir_all(repo.join("web")).expect("web dir");',
              '        fs::create_dir_all(repo.join("web")).expect("web dir");\n        fs::create_dir_all(repo.join("helper/src")).expect("helper src dir");',
              1,
          )
          text = text.replace(
              '"[package]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n",',
              '"[workspace]\\nmembers = [\\"helper\\"]\\nresolver = \\"3\\"\\n\\n[package]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n\\n[dependencies]\\nhelper = { path = \\"helper\\" }\\n",',
              1,
          )
          text = text.replace(
              '"# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\n",',
              '"# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \\"helper\\"\\nversion = \\"0.1.0\\"\\n\\n[[package]]\\nname = \\"ri2-fixture\\"\\nversion = \\"0.1.0\\"\\ndependencies = [\\n \\"helper\\",\\n]\\n",',
              1,
          )
          marker = '        .expect("lockfile");\n'
          helper = '''        .expect("lockfile");
          fs::write(
              repo.join("helper/Cargo.toml"),
              "[package]\\nname = \\"helper\\"\\nversion = \\"0.1.0\\"\\nedition = \\"2024\\"\\n",
          )
          .expect("helper manifest");
          fs::write(
              repo.join("helper/src/lib.rs"),
              "pub fn helper_marker() -> bool { true }\\n",
          )
          .expect("helper source");
'''
          if text.count(marker) != 1:
              raise SystemExit(f'lockfile fixture marker count={text.count(marker)}')
          text = text.replace(marker, helper, 1)
          text = text.replace('assert_eq!(packages.len(), 1);', 'assert_eq!(packages.len(), 2);', 1)
          text = text.replace(
              '    assert_eq!(packages[0].name, "ri2-fixture");',
              '    assert!(packages.iter().any(|package| package.name == "ri2-fixture"));\n    assert!(packages.iter().any(|package| package.name == "helper"));\n    let dependencies = index.project_dependencies(snapshot).expect("project dependencies");\n    assert!(dependencies.iter().any(|dependency| {\n        dependency.target_name == "helper" && dependency.target_package_id.is_some()\n    }));',
              1,
          )
          text = text.replace(
              '            && view.capability_tier == CapabilityTier::Tier2Project',
              '            && view.capability_tier == CapabilityTier::Tier2Project\n            && view.environment_fingerprint.is_some()',
              1,
          )
          target = '                .expect("simulate graph producer drift");'
          addition = '''                .expect("simulate graph producer drift");
              connection
                  .execute(
                      "UPDATE ri2_view_state SET environment_fingerprint='stale-env-v0' WHERE snapshot_id=? AND view_name='project'",
                      [&snapshot],
                  )
                  .expect("simulate project environment drift");'''
          if text.count(target) != 1:
              raise SystemExit(f'freshness env insertion target count={text.count(target)}')
          text = text.replace(target, addition, 1)
          bench.write_text(text, encoding='utf-8')
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Refresh lock for aer-environment edge
        run: cargo +1.97.1 check -p aer-repo
      - name: Frozen-lock lint
        run: cargo +1.97.1 clippy --locked -p aer-repo --all-targets -- -D warnings
      - name: RepoIntelBench
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench
      - name: Full aer-repo regression
        run: cargo +1.97.1 test --locked -p aer-repo --all-targets
      - name: Commit verified Tier-2 provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aer-repo
          git diff --cached --quiet && exit 0
          git commit -m "Bind RI2 project topology to environment provenance"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
