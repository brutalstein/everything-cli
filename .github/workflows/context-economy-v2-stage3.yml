name: Context Economy V2 Stage3

on:
  push:
    branches:
      - agent/context-economy-v2-stage2
    paths:
      - .aer-dev/stage3-runtime-assembly.py
      - .aer-dev/fix-stage3-transformer.py
      - .github/workflows/context-economy-v2-stage3.yml
  pull_request:
    branches:
      - feat/context-economy-v2
    paths:
      - .aer-dev/stage3-runtime-assembly.py
      - .aer-dev/fix-stage3-transformer.py
      - .github/workflows/context-economy-v2-stage3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-economy-v2-stage2
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Narrow Stage-3 transformer boundary
        run: python3 .aer-dev/fix-stage3-transformer.py
      - name: Apply fail-closed Stage-3 integration
        run: python3 .aer-dev/stage3-runtime-assembly.py
      - name: Format
        run: cargo +1.97.1 fmt --all
      - name: Lint runtime/provider/context packages
        run: cargo +1.97.1 clippy --locked -p aer-provider -p aer-core -p aer-context -p aer-repo --all-targets -- -D warnings
      - name: Test runtime/provider/context packages
        run: cargo +1.97.1 test --locked -p aer-provider -p aer-core -p aer-context -p aer-repo --all-targets
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          # Source is committed only after all deterministic gates above pass.
          rm -rf .aer-dev
          rm -f .github/workflows/context-economy-v2-stage3.yml
          git config user.name "aer-context-v2-bot"
          git config user.email "aer-context-v2@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(runtime): wire compact edits and provider context assembly"
          git push origin HEAD:agent/context-economy-v2-stage2
