name: Context Economy V2 Patch

on:
  push:
    branches:
      - feat/context-economy-v2
    paths:
      - .aer-dev/apply-context-economy-v2.py
      - .github/workflows/context-economy-v2-apply.yml
  pull_request:
    branches:
      - main
    paths:
      - .aer-dev/apply-context-economy-v2.py
      - .github/workflows/context-economy-v2-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-economy-v2
          fetch-depth: 0
      - name: Apply fail-closed source transformations
        run: python3 .aer-dev/apply-context-economy-v2.py
      - name: Format
        run: cargo fmt --all
      - name: Context and repository tests
        run: |
          cargo test -p aer-context
          cargo test -p aer-repo
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aer-dev
          rm -f .github/workflows/context-economy-v2-apply.yml
          git config user.name "aer-context-v2-bot"
          git config user.email "aer-context-v2@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(context): make evidence sufficiency budget-independent"
          git push origin HEAD:feat/context-economy-v2
