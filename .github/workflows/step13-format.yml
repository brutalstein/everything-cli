name: step13-format

on:
  push:
    branches: [agent/step-13-bounded-parallel-execution]
    paths: [.github/workflows/step13-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-13-bounded-parallel-execution
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo +1.97.1 fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-domain/src/scheduling.rs crates/aer-workspace/src/lib.rs crates/aer-workspace/src/parallel.rs crates/aer-core/src/parallel.rs crates/aer-core/src/root.rs crates/aer-core/tests/resource_bench.rs
          git diff --cached --quiet && exit 0
          git commit -m "Format Step 13 ResourceBench"
          git push origin HEAD:agent/step-13-bounded-parallel-execution
