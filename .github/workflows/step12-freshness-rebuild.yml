name: Step 12 corrected freshness rebuild

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-freshness-rebuild.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Apply freshness rebuild semantics
        shell: python
        run: |
          from pathlib import Path
          import re

          graph = Path('crates/aer-repo/src/ri2/graph_write.rs')
          text = graph.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(?m)^const GRAPH_PRODUCER: &str = "aer-ri2-graph";\nconst GRAPH_PRODUCER_VERSION: &str = "1";$',
              'pub(crate) const GRAPH_PRODUCER: &str = "aer-ri2-graph";\npub(crate) const GRAPH_PRODUCER_VERSION: &str = "1";',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'graph producer visibility count={count}')
          graph.write_text(text, encoding='utf-8')

          lib = Path('crates/aer-repo/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)let previous_snapshot = self\.current_snapshot_id\(&snapshot\.repo_id\)\?;\n'
              r'(?P=i)if previous_snapshot\.as_deref\(\) == Some\(&snapshot\.snapshot_id\) \{\n'
              r'(?P=i)    return self\.report_existing\(snapshot, true\);\n'
              r'(?P=i)\}\n'
          )
          def freshness(match):
              i = match.group('i')
              return (
                  f'{i}let previous_snapshot = self.current_snapshot_id(&snapshot.repo_id)?;\n'
                  f'{i}let snapshot_unchanged = previous_snapshot.as_deref() == Some(&snapshot.snapshot_id);\n'
                  f'{i}if snapshot_unchanged && !self.ri2_snapshot_requires_rebuild(&snapshot.snapshot_id)? {{\n'
                  f'{i}    return self.report_existing(snapshot, true);\n'
                  f'{i}}}\n'
                  f'{i}let continuity_snapshot = if snapshot_unchanged {{\n'
                  f'{i}    None\n'
                  f'{i}}} else {{\n'
                  f'{i}    previous_snapshot.as_deref()\n'
                  f'{i}}};\n'
              )
          text, count = pattern.subn(freshness, text, count=1)
          if count != 1:
              raise SystemExit(f'refresh freshness replacement count={count}')

          pattern = re.compile(
              r'(?m)^(?P<i>\s*)let transaction = self\.connection\.transaction\(\)\?;\n'
              r'(?P=i)insert_snapshot\(&transaction, &snapshot\)\?;\n'
          )
          def tx_replace(match):
              i = match.group('i')
              return (
                  f'{i}let transaction = self.connection.transaction()?;\n'
                  f'{i}clear_snapshot_materialized_views(\n'
                  f'{i}    &transaction,\n'
                  f'{i}    &snapshot.snapshot_id,\n'
                  f'{i}    snapshot_unchanged,\n'
                  f'{i})?;\n'
                  f'{i}insert_snapshot(&transaction, &snapshot)?;\n'
              )
          text, count = pattern.subn(tx_replace, text, count=1)
          if count != 1:
              raise SystemExit(f'refresh transaction replacement count={count}')

          text, count = re.subn(
              r'(ri2::rebuild_snapshot_views\(\s*&transaction,\s*&snapshot,\s*)previous_snapshot\.as_deref\(\),',
              r'\1continuity_snapshot,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'continuity replacement count={count}')

          marker = "fn insert_snapshot(tx: &Transaction<'_>, snapshot: &RepoSnapshotIdentity) -> Result<(), RepoError> {"
          helper = r'''fn clear_snapshot_materialized_views(
              transaction: &Transaction<'_>,
              snapshot_id: &str,
              producer_rebuild: bool,
          ) -> Result<(), RepoError> {
              for table in [
                  "runtime_links",
                  "semantic_links",
                  "test_links",
                  "cochanges",
                  "git_changes",
                  "git_commits",
                  "snapshot_files",
              ] {
                  transaction.execute(
                      &format!("DELETE FROM {table} WHERE snapshot_id=?"),
                      [snapshot_id],
                  )?;
              }
              if producer_rebuild {
                  transaction.execute(
                      "DELETE FROM ri2_symbol_continuity WHERE from_snapshot=? OR to_snapshot=?",
                      params![snapshot_id, snapshot_id],
                  )?;
              }
              Ok(())
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit(f'insert_snapshot anchor count={text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)
          lib.write_text(text, encoding='utf-8')

          bench = Path('crates/aer-repo/tests/repo_intel_2_bench.rs')
          text = bench.read_text(encoding='utf-8')
          if 'repo_intel_bench_rebuilds_derived_views_when_producer_identity_drifts_without_repo_change' not in text:
              text += r'''

          #[test]
          fn repo_intel_bench_rebuilds_derived_views_when_producer_identity_drifts_without_repo_change() {
              let fixture = Fixture::new();
              let mut index =
                  RepositoryIndex::open(&fixture.index, IndexPolicy::default()).expect("open RI2 index");
              let first = index.refresh(&fixture.repo).expect("first refresh");
              let snapshot = first.snapshot.snapshot_id.clone();
              assert!(index.refresh(&fixture.repo).expect("stable refresh").already_current);
              drop(index);

              let connection = rusqlite::Connection::open(&fixture.index).expect("open benchmark index directly");
              connection
                  .execute(
                      "UPDATE ri2_view_state SET producer_version='stale-v0' WHERE snapshot_id=? AND view_name='graph'",
                      [&snapshot],
                  )
                  .expect("simulate graph producer drift");
              connection
                  .execute(
                      "UPDATE snapshot_files SET parser_key='stale-parser-v0' WHERE snapshot_id=? AND path='src/auth.rs'",
                      [&snapshot],
                  )
                  .expect("simulate parser/query drift");
              drop(connection);

              let mut index =
                  RepositoryIndex::open(&fixture.index, IndexPolicy::default()).expect("reopen RI2 index");
              let rebuilt = index.refresh(&fixture.repo).expect("freshness rebuild");
              assert_eq!(rebuilt.snapshot.snapshot_id, snapshot);
              assert!(!rebuilt.already_current, "producer drift must rebuild even when repository bytes are unchanged");
              let auth = index.file(&snapshot, "src/auth.rs").expect("auth lookup").expect("auth file");
              assert_ne!(auth.parser_key.as_deref(), Some("stale-parser-v0"));
              assert!(index.ri2_view_states(&snapshot).expect("view states").iter().any(|view| {
                  view.view_name == "graph" && view.producer_version == "1"
              }));
          }
          '''
          bench.write_text(text, encoding='utf-8')
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Lint
        run: cargo +1.97.1 clippy --locked -p aer-repo --all-targets -- -D warnings
      - name: RepoIntelBench
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench
      - name: Full aer-repo regression
        run: cargo +1.97.1 test --locked -p aer-repo --all-targets
      - name: Commit corrected freshness semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-repo
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild RI2 derived views on producer drift"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
