name: Step 11 format repair

on:
  push:
    branches:
      - agent/step-11-provider-resilience-cost-router
    paths:
      - '.github/workflows/step11-format-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-11-provider-resilience-cost-router
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Correct failed-attempt accounting and format
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/aer-provider/src/routing.rs')
          text = path.read_text(encoding='utf-8')
          old = 'gateway_attempts: self.retry_policy.max_attempts,\n                        outcome: AttemptOutcome::Failed(error.class),'
          new = 'gateway_attempts: if error.retryable() {\n                            self.retry_policy.max_attempts\n                        } else {\n                            1\n                        },\n                        outcome: AttemptOutcome::Failed(error.class),'
          if old not in text:
              raise SystemExit('expected Step-11 accounting target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Format
        run: cargo +1.97.1 fmt --all
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-provider/src/lib.rs crates/aer-provider/src/routing.rs crates/aer-provider/tests/provider_router_bench.rs
          git diff --cached --quiet && exit 0
          git commit -m "Format Step 11 provider routing"
          git push origin HEAD:agent/step-11-provider-resilience-cost-router
