name: Step 12 format repair

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-format-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Commit format-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-repo/src/ri2/invalidation.rs crates/aer-repo/tests/repo_intel_2_bench.rs
          git diff --cached --quiet && exit 0
          git commit -m "Format Step 12 RI2 benchmark surface"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
