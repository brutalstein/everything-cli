name: RI2 documentation manifest refresh

on:
  push:
    branches:
      - agent/repository-intelligence-2-docs
    paths:
      - '.github/workflows/ri2-doc-manifest.yml'

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repository-intelligence-2-docs
          fetch-depth: 0
      - name: Refresh changed documentation hashes
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          changed = {
              'docs/06_REPOSITORY_INTELLIGENCE.md',
              'docs/07_CONTEXT_ECONOMY_ENGINE.md',
              'docs/15_ENGINEERING_STATE_AND_MEMORY.md',
              'docs/21_EVALUATION_AND_BENCHMARK_STRATEGY.md',
              'docs/25_IMPLEMENTATION_ROADMAP.md',
              'docs/28_RESEARCH_EVIDENCE.md',
              'docs/32_FINAL_ARCHITECTURE_DECISION_MATRIX.md',
          }
          manifest = Path('docs/MANIFEST.sha256')
          out = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) == 2 and parts[1] in changed:
                  digest = hashlib.sha256(Path(parts[1]).read_bytes()).hexdigest()
                  line = f'{digest}  {parts[1]}'
              out.append(line)
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')
      - name: Commit refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Refresh RI2 docs manifest [skip ci]"
          git push origin HEAD:agent/repository-intelligence-2-docs
