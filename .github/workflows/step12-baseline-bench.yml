name: Step 12 comparative retrieval baselines

on:
  push:
    branches:
      - agent/step-12-ri2-long-horizon-recovery
    paths:
      - '.github/workflows/step12-baseline-bench.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-12-ri2-long-horizon-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Add deterministic lexical graph embedding and current baselines
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/aer-repo/tests/repo_intel_2_bench.rs')
          text = path.read_text(encoding='utf-8')
          marker = '''fn relevant_yield(paths: impl IntoIterator<Item = String>, relevant: &BTreeSet<&str>) -> usize {
              paths
                  .into_iter()
                  .filter(|path| relevant.contains(path.as_str()))
                  .count()
          }
          '''
          helpers = marker + '''
          const BENCH_TEXT_PATHS: &[&str] = &[
              "src/lib.rs",
              "src/auth.rs",
              "src/session.rs",
              "tests/auth_test.rs",
              "tools/claims_probe.py",
              "web/credential.ts",
              "include/legacy.h",
          ];

          fn lexical_only(repo: &Path, query: &str, limit: usize) -> Vec<String> {
              let terms = query
                  .split(|character: char| !character.is_ascii_alphanumeric())
                  .filter(|term| !term.is_empty())
                  .map(str::to_ascii_lowercase)
                  .collect::<Vec<_>>();
              let mut scored = BENCH_TEXT_PATHS
                  .iter()
                  .filter_map(|relative| {
                      let text = fs::read_to_string(repo.join(relative)).ok()?.to_ascii_lowercase();
                      let score = terms
                          .iter()
                          .map(|term| text.matches(term).count())
                          .sum::<usize>();
                      (score > 0).then_some((score, (*relative).to_owned()))
                  })
                  .collect::<Vec<_>>();
              scored.sort_by(|left, right| right.0.cmp(&left.0).then_with(|| left.1.cmp(&right.1)));
              scored.truncate(limit);
              scored.into_iter().map(|(_, path)| path).collect()
          }

          fn hashed_ngram_embedding(text: &str) -> [u32; 64] {
              let normalized = text
                  .chars()
                  .filter(|character| character.is_ascii_alphanumeric())
                  .flat_map(char::to_lowercase)
                  .collect::<String>();
              let bytes = normalized.as_bytes();
              let mut vector = [0_u32; 64];
              for ngram in bytes.windows(3) {
                  let mut hash = 0xcbf29ce484222325_u64;
                  for byte in ngram {
                      hash ^= u64::from(*byte);
                      hash = hash.wrapping_mul(0x100000001b3);
                  }
                  vector[(hash as usize) % vector.len()] = vector[(hash as usize) % vector.len()].saturating_add(1);
              }
              vector
          }

          fn embedding_only(repo: &Path, query: &str, limit: usize) -> Vec<String> {
              let query = hashed_ngram_embedding(query);
              let mut scored = BENCH_TEXT_PATHS
                  .iter()
                  .filter_map(|relative| {
                      let text = fs::read_to_string(repo.join(relative)).ok()?;
                      let vector = hashed_ngram_embedding(&text);
                      let score = query
                          .iter()
                          .zip(vector.iter())
                          .map(|(left, right)| u64::from(*left) * u64::from(*right))
                          .sum::<u64>();
                      (score > 0).then_some((score, (*relative).to_owned()))
                  })
                  .collect::<Vec<_>>();
              scored.sort_by(|left, right| right.0.cmp(&left.0).then_with(|| left.1.cmp(&right.1)));
              scored.truncate(limit);
              scored.into_iter().map(|(_, path)| path).collect()
          }

          fn graph_only(index: &RepositoryIndex, snapshot: &str, limit: usize) -> Vec<String> {
              let symbol = index
                  .symbols(snapshot, "verify_token")
                  .expect("graph-only symbol seed")
                  .into_iter()
                  .next()
                  .expect("verify_token symbol");
              let graph = index
                  .graph_traverse(
                      snapshot,
                      &[symbol.symbol_id],
                      GraphDirection::Both,
                      TraversalBudget {
                          max_depth: 1,
                          max_nodes: limit.max(1),
                          max_edges: limit.saturating_mul(4).max(1),
                      },
                  )
                  .expect("graph-only traversal");
              let mut paths = graph.nodes.into_iter().filter_map(|node| node.path).collect::<Vec<_>>();
              paths.sort();
              paths.dedup();
              paths.truncate(limit);
              paths
          }
          '''
          if marker not in text:
              raise SystemExit('benchmark helper marker not found')
          text = text.replace(marker, helpers, 1)

          old = '''    let baseline = index
                  .search(snapshot, &query)
                  .expect("v1 retrieval baseline");
              let retrieval = index
                  .hybrid_retrieve(
                      snapshot,
                      &query,
                      TraversalBudget {
                          max_depth: 1,
                          max_nodes: 32,
                          max_edges: 64,
                      },
                  )
                  .expect("hybrid retrieval");
              let relevant = BTreeSet::from(["src/auth.rs", "src/session.rs"]);
              let baseline_yield = relevant_yield(baseline.hits.into_iter().map(|hit| hit.path), &relevant);
              let hybrid_yield = relevant_yield(retrieval.iter().map(|hit| hit.path.clone()), &relevant);
              assert!(
                  hybrid_yield > baseline_yield,
                  "RI2 hybrid retrieval should add the precise semantic neighbor within the same result bound"
              );
          '''
          new = '''    let lexical_paths = lexical_only(&fixture.repo, &query.text, query.limit);
              let current = index
                  .search(snapshot, &query)
                  .expect("current AER retrieval baseline");
              let graph_paths = graph_only(&index, snapshot, query.limit);
              let embedding_paths = embedding_only(&fixture.repo, &query.text, query.limit);
              let retrieval = index
                  .hybrid_retrieve(
                      snapshot,
                      &query,
                      TraversalBudget {
                          max_depth: 1,
                          max_nodes: 32,
                          max_edges: 64,
                      },
                  )
                  .expect("hybrid retrieval");
              let relevant = BTreeSet::from(["src/auth.rs", "src/session.rs"]);
              let lexical_yield = relevant_yield(lexical_paths, &relevant);
              let current_yield = relevant_yield(current.hits.into_iter().map(|hit| hit.path), &relevant);
              let graph_yield = relevant_yield(graph_paths, &relevant);
              let embedding_yield = relevant_yield(embedding_paths, &relevant);
              let hybrid_yield = relevant_yield(retrieval.iter().map(|hit| hit.path.clone()), &relevant);
              for (name, baseline_yield) in [
                  ("lexical-only", lexical_yield),
                  ("current-aer", current_yield),
                  ("graph-only", graph_yield),
                  ("hashed-ngram-embedding-only", embedding_yield),
              ] {
                  assert!(
                      hybrid_yield > baseline_yield,
                      "RI2 hybrid retrieval must earn its complexity over {name}: hybrid={hybrid_yield}, baseline={baseline_yield}"
                  );
              }
          '''
          if old not in text:
              raise SystemExit('retrieval baseline block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Canonical format
        run: cargo +1.97.1 fmt --all
      - name: Repository Intelligence 2.0 lint
        run: cargo +1.97.1 clippy --locked -p aer-repo --all-targets -- -D warnings
      - name: RepoIntelBench comparative gate
        run: cargo +1.97.1 test --locked -p aer-repo --test repo_intel_2_bench
      - name: Commit benchmark baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aer-repo/tests/repo_intel_2_bench.rs
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen RepoIntelBench comparative baselines"
          git push origin HEAD:agent/step-12-ri2-long-horizon-recovery
